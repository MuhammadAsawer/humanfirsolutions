<!doctype html>
<html lang="ur"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Data bachao</title>
<style>
:root{--paper:#faf7f2;--ink:#1a1a1a;--steel:#6b6b6b;--line:#ddd7cc;--ok:#1d7a3e;--bad:#b3261e;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#16150f;--ink:#f0ece4;--steel:#9a958a;--line:#33312a;--ok:#5fd18a;--bad:#ff6b5e}}
:root[data-theme="dark"]{--paper:#16150f;--ink:#f0ece4;--steel:#9a958a;--line:#33312a;--ok:#5fd18a;--bad:#ff6b5e}
*{box-sizing:border-box}
body{margin:0 auto;max-width:620px;background:var(--paper);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,sans-serif;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--steel);font-size:13.5px;margin:0 0 18px}
.box{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{white-space:nowrap}
.big{font-size:30px;font-weight:700;line-height:1.15;display:block}
.ok{color:var(--ok)} .bad{color:var(--bad)}
button{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;
  background:transparent;color:var(--ink);font:inherit;font-weight:600;margin-top:10px}
button.go{background:var(--ink);color:var(--paper);border-color:var(--ink)}
textarea{width:100%;height:130px;margin-top:10px;font-family:ui-monospace,monospace;font-size:11px;
  border:1px solid var(--line);border-radius:10px;padding:10px;background:transparent;color:var(--ink)}
.note{font-size:12.5px;color:var(--steel);border-top:1px solid var(--line);margin-top:22px;padding-top:14px}
</style></head><body>

<h1>Data bachao</h1>
<p class="sub">Yeh safha sirf PARHTA hai. Kuch likhta, mitata ya bhejta nahi. Is se aap ka data kharab nahi ho sakta.</p>

<div class="box" id="sum"><span class="big">…</span><span class="sub">dekh raha hai</span></div>
<div class="box" id="det"></div>

<button class="go" onclick="save()">Backup file mehfooz karein</button>
<button onclick="show()">Data screen par dikhayein (copy ke liye)</button>
<textarea id="ta" style="display:none" readonly></textarea>

<p class="note">Agar yahan ginti nazar aa rahi hai to aap ka kaam is phone par mehfooz hai. Pehle backup file save karein, phir batayein — wapas chaRhane ka tareeqa uske baad.</p>

<script>
var KEYS = ['hf_client_cheema','hf_outbox'];
var dump = {};

function num(x){ return (x==null) ? 0 : x; }

function look(){
  var det = document.getElementById('det');
  var sum = document.getElementById('sum');
  var rows = '', total = 0, cErr = '';

  // Site ki har chabi utha lete hain — naam badla ho to bhi kuch na chhoote
  try{
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (KEYS.indexOf(k) < 0 && /hf/i.test(k)) KEYS.push(k);
      dump[k] = localStorage.getItem(k);
    }
  }catch(e){ cErr = e.message; }

  var c = null, o = [];
  try{ c = JSON.parse(localStorage.getItem('hf_client_cheema')||'null'); }catch(e){ cErr = e.message; }
  try{ o = JSON.parse(localStorage.getItem('hf_outbox')||'[]'); }catch(e){}

  function add(label, n){
    rows += '<div class="row"><span>'+label+'</span><b>'+n+'</b></div>';
  }

  if (c){
    var j = (c.journal||[]).length, p = (c.purchases||[]).length,
        or_ = (c.orders||[]).length, e = (c.expenses||[]).length,
        pay = (c.payments||[]).length, rm = (c.rawMaterials||[]).length,
        mn = (c.menu||[]).length;
    total = j + p + or_ + e + pay;
    add('Naam', c.name || '—');
    add('Journal (hisaab ki linein)', j);
    add('Purchases (kharid)', p);
    add('Orders', or_);
    add('Kharche', e);
    add('Payments', pay);
    add('Menu', mn);
    add('Khaam maal', rm);
  } else {
    add('Client ka data', 'NAHI MILA');
  }
  add('Outbox (jo cloud tak nahi pohancha)', (o||[]).length);
  total += (o||[]).length;

  det.innerHTML = rows;
  if (total > 0){
    sum.innerHTML = '<span class="big ok">'+total+'</span><span class="sub">cheezein is phone par mojood hain</span>';
  } else {
    sum.innerHTML = '<span class="big bad">0</span><span class="sub">is phone par kuch nahi mila'+
      (cErr ? ' ('+cErr+')' : '')+'</span>';
  }
}

function blobText(){
  return JSON.stringify({ kab:new Date().toISOString(), ye:location.href, data:dump }, null, 1);
}
function save(){
  try{
    var b = new Blob([blobText()], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'cheema-backup-' + Date.now() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert('Save nahi hua: ' + e.message + ' — neeche wala button dabayein'); }
}
function show(){
  var ta = document.getElementById('ta');
  ta.style.display = 'block';
  ta.value = blobText();
  ta.focus(); ta.select();
}
look();
</script>
</body></html>
