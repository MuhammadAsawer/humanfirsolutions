const CLOSING_ACCOUNTS = [
  { code:'5985', name:'Cash Short / Over', type:'Expense' },   // 5950 se ALAG
  { code:'3100', name:"Owner's Drawings",  type:'Equity'  }
];

/* Har expense head ka apna khaata — warna sab 5900 mein gir jate hain */
const EXPENSE_HEAD_ACCOUNTS = {
  'Rent':          '5100',
  'Utilities':     '5200',
  'Salaries':      '5300',
  'Transport':     '5400',
  'Purchases':     '5000',
  'Miscellaneous': '5900'
};

function accountForHead(client, head) {
  if (EXPENSE_HEAD_ACCOUNTS[head]) return EXPENSE_HEAD_ACCOUNTS[head];
  const map = client.headAccounts || {};
  return map[head] || '5900';      // client ka apna head → Miscellaneous
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 2 — DIN KI HARKAT
   Sirf woh cheezein jo waqai hui. Void shuda kuch nahi.
   ───────────────────────────────────────────────────────────────────────── */

const ORDER_IS_REAL = ['confirmed','cooking','ready','delivered','completed'];
const ORDER_IS_DEAD = ['cancelled','void'];

function isVoided(client, kind, id) {
  return (client.voids || []).some(v => v.kind === kind && v.id === id);
}

function dayMovements(client, date) {
  const orders = (client.orders || []).filter(o =>
        dayOf(o.at) === date
     && !ORDER_IS_DEAD.includes(o.status || 'confirmed')
     && !isVoided(client, 'order', o.id));

  const expenses  = (client.expenses  || []).filter(e => e.date === date && !isVoided(client,'expense',e.id));
  const purchases = (client.purchases || []).filter(p => p.date === date && !isVoided(client,'purchase',p.id));
  const payments  = (client.payments  || []).filter(p => p.date === date && !isVoided(client,'payment',p.id));
  const returns   = (client.returns   || []).filter(r => r.date === date);

  const sum = (a,f) => a.reduce((s,x) => s + (Number(f(x))||0), 0);

  const cashSales   = sum(orders, o => o.received);            // jo waqai mila
  const totalBilled = sum(orders, o => o.bill);
  const creditSales = totalBilled - cashSales;                 // jo udhaar raha

  return {
    date,
    orders: orders.length,
    totalBilled,
    cashSales,
    creditSales,
    tax:            sum(orders, o => (o.tax && o.tax.amount) || 0),
    netSales:       sum(orders, o => o.subtotal),
    custCollections:sum(payments.filter(p=>p.kind==='customer'), p => p.amount),
    supplierPaid:   sum(payments.filter(p=>p.kind==='supplier'), p => p.amount),
    cashExpenses:   sum(expenses.filter(e=>(e.method||'Cash')==='Cash'), e => e.amount),
    totalExpenses:  sum(expenses,  e => e.amount),
    // Sirf woh raqam jo WAQAI di gayi. Udhaar ki kharidari cash se nahi jati.
    // (Pehle poora amount ghata jata tha — 3,000 udhaar ki kharidari cash
    //  kam kar deti thi, aur din ka naqd ghalat nikalta.)
    cashPurchases:  sum(purchases.filter(p=>(p.method||'Cash')==='Cash'),
                        p => (p.paid !== undefined ? p.paid : p.amount)),
    totalPurchases: sum(purchases, p => p.amount),
    cashReturns:    sum(returns,   r => r.amount),
    capIn:          sum((client.capitalEntries||[]).filter(c=>c.date===date && c.kind==='inject'), c=>c.amount),
    drawings:       sum((client.capitalEntries||[]).filter(c=>c.date===date && c.kind==='draw'),  c=>c.amount)
  };
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 3 — OPENING CASH
   Aaj ka opening = kal ka closing. Zanjeer. Owner ka figure hamesha jeetta.
   ───────────────────────────────────────────────────────────────────────── */

function closingCash(opening, m) {
  return opening
       + m.cashSales + m.custCollections + m.capIn
       - m.cashExpenses - m.cashReturns - m.cashPurchases
       - m.supplierPaid - m.drawings;
}

function prevDate(date) { return addDays(date, -1); }

function openingCash(client, date, memo, depth) {
  memo = memo || {}; depth = depth || 0;

  if (client.cashOverride && client.cashOverride[date] !== undefined)
    return client.cashOverride[date];                 // haath ka figure jeetta hai
  if (memo[date] !== undefined) return memo[date];

  const start = client.openingCash;                    // { date, amount }
  if (start) {
    if (date <  start.date) return 0;                  // karobar shuru hi nahi hua
    if (date === start.date) return start.amount;
  }
  if (depth > 365) return 0;                           // hadd — na-khatam zanjeer se bachao

  const p = prevDate(date);

  // Band shuda din ka darj shuda closing hi SACH hai.
  // (Yeh bug test ne pakRa: cash ginti mein 200 kam nikle, farq 5985 mein
  //  post bhi hua, magar agle din ka opening phir bhi system wala figure
  //  deta tha — kyunki zanjeer journal ko nahi parhti. Woh 200 ka farq
  //  har agle din chalta rehta.)
  const closed = (client.closedDays || []).find(d => d.date === p);
  if (closed) { memo[date] = closed.closingCash; return closed.closingCash; }

  const po = openingCash(client, p, memo, depth + 1);
  const v  = closingCash(po, dayMovements(client, p));
  memo[date] = v;
  return v;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 4 — CASH GINTI
   Haath ki cash hi sach hai. Farq apne khaate mein jata hai taake
   kal ka opening asli cash ke barabar ho.
   ───────────────────────────────────────────────────────────────────────── */

function reconcileCash(client, session, date, counted) {
  if (!session.canWriteAccounts) throw new Error('Ijazat nahi');
  if (counted == null || isNaN(counted) || counted < 0)
    throw new Error('Ginti ke baad jo cash haath mein hai woh likhein');

  const opening  = openingCash(client, date);
  const expected = closingCash(opening, dayMovements(client, date));
  const diff     = Math.round((counted - expected) * 100) / 100;

  if (Math.abs(diff) < 0.01)
    return { barabar:true, expected, counted, diff:0, lines:[] };

  const lines = diff > 0
    ? [{ account:'1000', dr:diff,  cr:0 }, { account:'5985', dr:0, cr:diff }]
    : [{ account:'5985', dr:-diff, cr:0 }, { account:'1000', dr:0, cr:-diff }];

  lines.forEach(l => client.journal.push(Object.assign({
    ref:'CASHCOUNT-' + date, at:atFor(date, 23, 59),
    desc:'Cash ginti — ' + (diff > 0 ? 'zyada' : 'kam')
  }, l)));

  return { barabar:false, expected, counted, diff, lines };
}
