<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rent A Car — HF Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#15181B; --asphalt-2:#21252A;
  --paper:#F1EDE3; --paper-2:#E5DFD1;
  --plate:#C9971F; --plate-lit:#E3B94A;
  --route:#3E6E52; --stop:#A63B2E; --steel:#70787F;
  --line:rgba(21,24,27,.13); --r:14px;
}
@media(prefers-color-scheme:dark){:root{
  --asphalt:#F1EDE3; --asphalt-2:#D9D2C1;
  --paper:#121416; --paper-2:#1C2023;
  --plate:#E3B94A; --plate-lit:#F0CC6E;
  --route:#6FAE87; --stop:#E08776; --steel:#9BA3AA;
  --line:rgba(241,237,227,.14);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--asphalt);height:100%}
body{font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
.mono{font-family:"JetBrains Mono",monospace}
.ur{font-family:"Noto Nastaliq Urdu",serif;line-height:2.05}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.scr{display:none} .scr.on{display:block}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  margin:0 -16px 20px;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;
  background:var(--asphalt);color:var(--paper);border-radius:0 0 18px 18px}
.brand{font-size:18px;margin:0;font-weight:600}
.who{font-size:12px;color:color-mix(in srgb,var(--paper) 62%,transparent);margin:2px 0 0}
.day{text-align:right;font-size:12px;color:color-mix(in srgb,var(--paper) 62%,transparent);white-space:nowrap}
.day b{display:block;color:var(--paper);font-size:15px}
.back{background:none;border:0;color:var(--paper);font:inherit;font-size:15px;padding:0;cursor:pointer}

.hero-k{font-size:13px;color:var(--steel);margin:0 0 2px}
.hero-n{font-size:clamp(44px,14vw,60px);font-weight:600;letter-spacing:-.03em;line-height:1;margin:0;color:var(--plate)}
.hero-n small{font-size:.32em;font-weight:500;color:var(--steel);margin-inline-start:.3em}
.fleetbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--paper-2);margin:16px 0 9px}
.fleetbar i{display:block}
.legend{display:flex;gap:16px;font-size:12.5px;flex-wrap:wrap;margin-bottom:24px}
.legend span{display:flex;align-items:center;gap:6px;color:var(--steel)}
.legend b{color:var(--asphalt)}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
.tile{background:var(--paper);padding:13px 10px}
.tile .v{font-size:19px;font-weight:600} .tile .k{font-size:10.5px;color:var(--steel);margin-top:1px}
h2{font-size:14px;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 em{font-style:normal;font-size:12px;color:var(--steel);font-weight:400}
.rows{border-top:1px solid var(--line);margin-bottom:24px}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.row.tapable{cursor:pointer}.row.tapable:active{background:var(--paper-2)}
.row.tapable::after{content:'\\203a';color:var(--steel);font-size:18px;margin-inline-start:2px}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;white-space:nowrap} .row .amt.owed{color:var(--stop)}
.reg{font-family:"JetBrains Mono",monospace;font-size:12px;background:var(--paper-2);padding:3px 7px;border-radius:5px;flex:none}
.tag{font-size:10px;padding:3px 8px;border-radius:99px;flex:none;font-weight:600}
.tag.confirmed{background:color-mix(in srgb,var(--plate) 18%,transparent);color:var(--plate)}
.tag.completed{background:color-mix(in srgb,var(--route) 16%,transparent);color:var(--route)}
.vstatus{font-size:10.5px;padding:3px 9px;border-radius:99px;flex:none;font-weight:600}
.vstatus.available{background:color-mix(in srgb,var(--route) 16%,transparent);color:var(--route)}
.vstatus.rented{background:color-mix(in srgb,var(--stop) 14%,transparent);color:var(--stop)}
.vstatus.maintenance{background:color-mix(in srgb,var(--steel) 18%,transparent);color:var(--steel)}
.own-tag{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--steel)}

.search{width:100%;padding:11px 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:11px;
  background:var(--paper);color:var(--asphalt);font:inherit;font-size:15px}
label{display:block;font-size:12.5px;color:var(--steel);margin:12px 0 6px}
label:first-of-type{margin-top:0}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
  background:var(--paper);color:var(--asphalt);font:inherit;font-size:15px}
input:focus,select:focus{outline:2px solid var(--plate);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{padding:9px 14px;border:1.5px solid var(--line);border-radius:99px;background:transparent;
  color:var(--asphalt);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--asphalt);background:var(--asphalt);color:var(--paper)}
.hint{font-size:12px;color:var(--steel);margin:6px 0 0}
.hint.warn{color:var(--stop)}
.hint.ok{color:var(--route)}

.pl{border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:24px}
.pl .l{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.pl .l.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:11px;font-weight:600;font-size:16px}
.pos{color:var(--route)} .neg{color:var(--stop)}

.act{position:fixed;inset-inline:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px;max-width:560px;margin:0 auto}
.act button{flex:1;padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:transparent;
  color:var(--asphalt);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;line-height:1.2}
.act button.go{background:var(--asphalt);color:var(--paper);border-color:var(--asphalt)}
.act button:disabled{opacity:.4}
.note{font-size:11.5px;color:var(--steel);border-top:1px solid var(--line);padding-top:12px}
.ok{color:var(--route)}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-box{background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet-box h3{margin:0 0 12px;font-size:17px}
.sheet-act{display:flex;gap:9px;margin-top:16px}
.sheet-act button,.sheet-act a{flex:1;padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:transparent;
  color:var(--asphalt);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;
  display:flex;flex-direction:column;align-items:center;line-height:1.2;box-sizing:border-box}
.sheet-act .go{background:var(--asphalt);color:var(--paper);border-color:var(--asphalt);flex:1.6}

.doc{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;background:var(--paper-2)}
.doc pre{font-family:"JetBrains Mono",monospace;font-size:12px;white-space:pre-wrap;margin:0;line-height:1.6}
.copybtn{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:transparent;
  color:var(--steel);font:inherit;font-size:13px;cursor:pointer;margin-top:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));
  background:var(--asphalt);color:var(--paper);padding:11px 18px;border-radius:99px;font-size:14px;
  font-weight:600;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.login{max-width:400px;margin:0 auto;padding:14vh 22px 40px}
#syncdot{font-size:9px;color:var(--plate)}
#syncdot.ok{color:var(--route)} #syncdot.off{color:var(--stop)}
.login h1{font-size:22px;margin:0 0 2px} .login .mut{color:var(--steel);font-size:14px;margin:0 0 24px}
.go{width:100%;padding:14px;border:0;border-radius:13px;background:var(--asphalt);color:var(--paper);font-size:15.5px;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<section class="scr on" id="s-login">
  <div class="login">
    <h1>Rent A Car</h1><p class="mut">HF Solutions</p>
    <label>Username</label><input id="lg-email" autocapitalize="none" placeholder="username">
    <label>Password</label><input id="lg-pass" type="password">
    <button class="go" id="lg-go" onclick="doLogin()">Andar aayein</button>
    <p class="hint" id="lg-msg"></p>
  </div>
</section>

<div class="wrap" id="app" style="display:none">

<section class="scr on" id="s-dash">
  <div class="top">
    <div><h1 class="brand" id="cname">Rent A Car</h1>
      <p class="who"><span id="syncdot" class="mono">&#9679;</span> <span id="syncmsg">-</span></p></div>
    <div class="day"><b id="dnum">-</b><span id="dtxt">-</span></div>
  </div>
  <p class="hero-k">Is waqt bahar</p>
  <p class="hero-n" id="heroOut">-<small id="heroTot">/ 0</small></p>
  <div class="fleetbar" id="fleetbar"></div>
  <div class="legend" id="fleetLegend"></div>
  <div class="tiles" id="tiles"></div>
  <h2>Aaj active <em id="bcount"></em></h2>
  <div class="rows" id="blist"></div>
  <h2>Fleet <em id="fcount"></em></h2>
  <div class="rows" id="flist"></div>
  <p class="note" id="checks"></p>
</section>

<section class="scr" id="s-vehnew">
  <div class="top"><div><button class="back" onclick="go('dash')">&lsaquo; Wapas</button>
    <h1 class="brand" style="font-size:18px">Nayi Gari</h1></div><div></div></div>
  <label>Registration number</label><input id="vh-reg" class="mono" placeholder="LEA-1234">
  <div class="grid2"><div><label>Make</label><input id="vh-make" placeholder="Suzuki"></div>
    <div><label>Model</label><input id="vh-model" placeholder="Alto"></div></div>
  <label>Roz ka kiraya (Rs)</label><input id="vh-rate" type="number" inputmode="numeric">
  <label>Malikiyat</label>
  <div class="chiprow" id="vh-own"></div>
  <div id="vh-owned-fields">
    <label>Kharch (Rs)</label><input id="vh-cost" type="number" inputmode="numeric">
    <label>Purchase date</label><input id="vh-pdate" type="date">
  </div>
  <div id="vh-tp-fields" style="display:none">
    <label>Malik ka naam</label><input id="vh-ownername" placeholder="naam">
    <label>Commission %</label><input id="vh-comm" type="number" inputmode="numeric" placeholder="20">
  </div>
  <p class="hint" id="vh-hint"></p>
</section>

<section class="scr" id="s-booknew">
  <div class="top"><div><button class="back" onclick="go('dash')">&lsaquo; Wapas</button>
    <h1 class="brand" style="font-size:18px">Nayi Booking</h1></div><div></div></div>
  <label>Gari</label><select id="bk-veh"></select>
  <div class="chiprow" id="bk-type"></div>
  <label>Renter ka naam <span class="hint" style="display:inline">(lazmi)</span></label>
  <input id="bk-name" placeholder="naam likhein">
  <div class="grid2">
    <div><label>CNIC</label><input id="bk-cnic" placeholder="35202-xxxxxxx-x"></div>
    <div><label>License</label><input id="bk-license" placeholder="LHR-xxxxx"></div>
  </div>
  <label>ID card ki tasveer (marzi)</label>
  <input id="bk-photo" type="file" accept="image/*" capture="environment" onchange="onBkPhoto(this)">
  <p class="hint" id="bk-photo-msg"></p>
  <div class="grid2">
    <div><label>Pickup</label><input id="bk-pickup" type="date"></div>
    <div><label>Drop-off</label><input id="bk-dropoff" type="date"></div>
  </div>
  <div class="grid2">
    <div><label>Roz ka kiraya</label><input id="bk-rate" type="number" inputmode="numeric"></div>
    <div><label>Security deposit</label><input id="bk-dep" type="number" inputmode="numeric" value="0"></div>
  </div>
  <label>Shuru ka meter (km)</label><input id="bk-km" type="number" inputmode="numeric" value="0">
  <p class="hint" id="bk-total"></p>
  <p class="hint warn" id="bk-msg"></p>
</section>

<section class="scr" id="s-checkout">
  <div class="top"><div><button class="back" onclick="go('dash')">&lsaquo; Wapas</button>
    <h1 class="brand" style="font-size:18px">Checkout</h1></div><div></div></div>
  <div id="co-summary"></div>
  <label>Aakhri meter (km)</label><input id="co-km" type="number" inputmode="numeric">
  <label>Nuqsan (Rs, agar ho)</label><input id="co-damage" type="number" inputmode="numeric" value="0">
  <p class="hint" id="co-hint"></p>
  <p class="hint warn" id="co-msg"></p>
</section>

<section class="scr" id="s-taxi">
  <div class="top"><div><button class="back" onclick="go('dash')">&lsaquo; Wapas</button>
    <h1 class="brand" style="font-size:18px">Taxi Mode</h1></div><div></div></div>
  <label>Gari</label><select id="tx-veh"></select>
  <div id="tx-shift"></div>
  <h2>Naya trip</h2>
  <label>Kiraya (Rs)</label><input id="tx-fare" type="number" inputmode="numeric">
  <label>Location (marzi)</label><input id="tx-loc" placeholder="se - tak">
  <div class="grid2">
    <div><label>Naam (marzi)</label><input id="tx-name" placeholder=""></div>
    <div><label>Number (marzi)</label><input id="tx-phone" type="tel"></div>
  </div>
  <h2 style="margin-top:20px">Aaj ki kamai <em id="tx-count"></em></h2>
  <div class="tiles" id="tx-tiles"></div>
  <div class="rows" id="tx-list"></div>
</section>

<section class="scr" id="s-rep">
  <div class="top"><div><button class="back" onclick="go('dash')">&lsaquo; Wapas</button>
    <h1 class="brand" style="font-size:18px">Reports</h1></div><div></div></div>
  <h2>Munafa / Nuqsan</h2><div class="pl" id="rp-pl"></div>
  <h2>Owners ko dena</h2><div class="rows" id="rp-owners"></div>
  <h2>Balance sheet</h2><div class="pl" id="rp-bs"></div>
</section>

<section class="scr" id="s-set">
  <div class="top"><div><button class="back" onclick="go('dash')">&lsaquo; Wapas</button>
    <h1 class="brand" style="font-size:18px">Settings</h1></div><div></div></div>
  <div class="rows" id="st-mods"></div>
</section>

</div>

<div class="sheet" id="billsheet">
  <div class="sheet-box">
    <h3>Booking / Trip</h3>
    <div id="bs-summary"></div>
    <img id="bs-photo" style="display:none;width:100%;border-radius:10px;margin:10px 0;max-height:220px;object-fit:cover">
    <label>Phone (WhatsApp bill ke liye)</label>
    <input id="bs-phone" type="tel" placeholder="03xx xxxxxxx">
    <div class="doc" style="margin-top:12px"><pre id="bs-bill"></pre></div>
    <div class="doc" id="bs-agree-box"><pre id="bs-agree"></pre></div>
    <div class="sheet-act">
      <button onclick="closeBillSheet()">Band karein</button>
      <a class="go" id="bs-send" href="#" target="_blank" rel="noopener" onclick="return onBillSend()">WhatsApp</a>
    </div>
    <button class="copybtn" onclick="copyBillText()">Bill copy karein</button>
  </div>
</div>

<div class="act" id="actbar"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>/* =========================================================================
   HF SOLUTIONS — E1: RESTAURANT CORE PRINT
   =========================================================================
   Bunyadi usool jo is file mein nafiz hain:

   1. Core Print mein KABHI matn nahi likha jata — sirf CHAABI.
      Core kehta hai 'received'. Matn LANG file se aata hai.
      Naya mulk = nayi zaban ki file. Core waisa ka waisa rehta hai.

   2. Deny-by-default: jo yahan likha nahi, woh UI mein banega hi nahi.

   3. Core seed deta hai, client baRhata hai. Client ka baRhaya hua
      kabhi Core mein wapas nahi jata.

   4. Core Prints aapas mein nahi miltay. Naya Core purane ki NAQAL se
      banta hai (copy at birth), runtime inheritance bilkul nahi.
   ========================================================================= */

/* ─────────────────────────────────────────────────────────────────────────
   WAQT — poore software mein tareekh SIRF yahan se.
   Karobar ki tareekh = device ka MAQAMI din (Pakistan), London ka nahi.
   Har waqt ki mohar (at) = asal UTC lamha.

   Pehle `toISOString().slice(0,10)` se tareekh nikalti thi — woh London
   ka din deta hai. Pakistan 5 ghante aage hai, to aadhi raat se subah 5
   baje tak har order PICHHLE din mein jata tha, aur band shuda din mein
   bhi ghus jata tha. `prevDate` Pakistan mein ek din CHHOR deta tha
   (22 ka pichhla 20). Saare test London ke waqt mein chalte the — is
   liye kabhi pakRa nahi gaya.
   ───────────────────────────────────────────────────────────────────────── */
function _p2(n){ return String(n).padStart(2,'0'); }
function _fmt(d){ return d.getFullYear() + '-' + _p2(d.getMonth()+1) + '-' + _p2(d.getDate()); }
function dayOf(iso){ if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? String(iso).slice(0,10) : _fmt(d); }
function localToday(){ return _fmt(new Date()); }
function addDays(date, n){ const [y,m,d] = date.split('-').map(Number); return _fmt(new Date(y, m-1, d+n)); }
function atFor(date, hh, mm){ const [y,m,d] = date.split('-').map(Number); return new Date(y, m-1, d, hh||0, mm||0, 0).toISOString(); }

/* ─────────────────────────────────────────────────────────────────────────
   HISSA 1 — ZABAAN
   Har chaabi ke saamne har zaban ka matn. Naya mulk = naya block.
   `second` woh chhoti doosri zaban hai jo lebal ke neeche likhi jayegi.
   ───────────────────────────────────────────────────────────────────────── */

const LANG = {
  ur: {
    _name: 'اردو', _dir: 'rtl', _second: 'en',
    dinein:'ڈائن اِن', delivery:'ڈلیوری', reservation:'بکنگ',
    order:'آرڈر', newOrder:'نیا آرڈر', customer:'گاہک', walkin:'واک اِن',
    item:'آئٹم', menu:'مینو', qty:'تعداد', price:'قیمت',
    bill:'بل', received:'وصول', due:'بقایا',
    supplier:'سپلائر', purchase:'خریداری', expense:'خرچہ',
    rawMaterial:'خام مال', stock:'اسٹاک',
    dashboard:'ڈیش بورڈ', reports:'رپورٹس', settings:'سیٹنگز',
    todaySales:'آج کی فروخت', todayOrders:'آج کے آرڈرز',
    cashInHand:'نقد موجود', receivables:'وصولی باقی', topItems:'زیادہ بکنے والے'
  },

  en: {
    _name: 'English', _dir: 'ltr', _second: 'ur',
    dinein:'Dine-in', delivery:'Delivery', reservation:'Reservation',
    order:'Order', newOrder:'New Order', customer:'Customer', walkin:'Walk-in',
    item:'Item', menu:'Menu', qty:'Qty', price:'Price',
    bill:'Bill', received:'Received', due:'Balance due',
    supplier:'Supplier', purchase:'Purchase', expense:'Expense',
    rawMaterial:'Raw Material', stock:'Stock',
    dashboard:'Dashboard', reports:'Reports', settings:'Settings',
    todaySales:'Sales today', todayOrders:'Orders today',
    cashInHand:'Cash in hand', receivables:'Receivable', topItems:'Top sellers'
  },

  ro: {   // Roman Urdu
    _name: 'Roman Urdu', _dir: 'ltr', _second: 'en',
    dinein:'Dine-in', delivery:'Delivery', reservation:'Booking',
    order:'Order', newOrder:'Naya Order', customer:'Grahak', walkin:'Walk-in',
    item:'Item', menu:'Menu', qty:'Tadaad', price:'Qeemat',
    bill:'Bill', received:'Wasool', due:'Bakaya',
    supplier:'Supplier', purchase:'Kharidari', expense:'Kharcha',
    rawMaterial:'Khaam Maal', stock:'Stock',
    dashboard:'Dashboard', reports:'Reports', settings:'Settings',
    todaySales:'Aaj ki sale', todayOrders:'Aaj ke orders',
    cashInHand:'Naqd maujood', receivables:'Wasooli baqi', topItems:'Zyada bikne wale'
  }
};

// Lebal nikalne ka wahid tareeqa. Poore software mein matn sirf yahan se aaye.
function t(key, lang) {
  const L = LANG[lang] || LANG.en;
  return L[key] || LANG.en[key] || key;
}

// Chhoti doosri zaban wala lebal (aap ne jo kaha: neeche chhota likha ho)
function t2(key, lang) {
  const L = LANG[lang] || LANG.en;
  const s = t(key, L._second);
  return s === t(key, lang) ? '' : s;   // dono ek jaise hon to neeche kuch na likho
}

/* =========================================================================
   HF SOLUTIONS — E2: REGISTRY + RESOLVER
   =========================================================================
   Yeh woh WAHID jagah hai jahan se poora software poochta hai:
   "is client ko kya milega?"

   Aaj yeh sawal 90 se zyada jagah alag alag tareeqe se poocha jata hai —
   client.type === '...' 41 baar, orderMode === 'quick' 22 baar,
   hasStock 21, needsKitchen 19, isRental 24, needsDisplay 15.
   Ek jagah bhool jao to catering ki cheez restaurant mein aa jati hai.

   E2 ke baad sirf ek sawal: resolveUI(client).

   E1 (LANG, RESTAURANT_CORE, MODULES) is se pehle load hona chahiye.
   ========================================================================= */


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 1 — REGISTRY
   Har business type ka apna Core. Aapas mein nahi miltay.
   ───────────────────────────────────────────────────────────────────────── */

const COREPRINTS = {
  restaurant: RESTAURANT_CORE
  // catering:  CATERING_CORE,      ← baad mein Alsayyam se
  // carRental: CAR_RENTAL_CORE,    ← baad mein Bhaikhan + Saalar se
  // retail, services, pharmacy, wholesale ← sire se naye
};

function corePrintFor(typeId) {
  const c = COREPRINTS[typeId];
  if (!c) throw new Error('Core Print mafqood: ' + typeId);
  return c;
}

/* Gehri naqal. Core Print ko koi runtime code chhoo na sake. */
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 2 — COPY AT BIRTH
   Naya Core purane ki NAQAL se banta hai. Runtime inheritance bilkul nahi.
   Warna Restaurant mein ki gayi tabdeeli Fast Food mein leak hoti.
   ───────────────────────────────────────────────────────────────────────── */

function newCoreFrom(parentId, newId) {
  const parent = corePrintFor(parentId);
  const child  = deepCopy(parent);
  child.id      = newId;
  child.version = 1;
  child.bornFrom = {                 // audit ke liye — parent ka version bhi lock
    from:    parent.id,
    version: parent.version,
    date:    new Date().toISOString()
  };
  COREPRINTS[newId] = child;
  return child;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 3 — MODULE CHECK
   Har module apni zaroorat khud batata hai. Ek band karne se doosra
   aadha nahi tootna chahiye.
   ───────────────────────────────────────────────────────────────────────── */

function enabledModules(core, client) {
  const on = new Set(core.modules.default);

  // Client sirf OPTIONAL module on/off kar sakta hai. Default wale nahi.
  const s = (client.moduleSettings) || {};
  core.modules.optional.forEach(m => { if (s[m] === true) on.add(m); });
  core.modules.default.forEach(m => { if (s[m] === false) on.delete(m); });

  // Zaroorat poori karo: A ko B chahiye to B bhi on
  let changed = true;
  while (changed) {
    changed = false;
    on.forEach(id => {
      const mod = MODULES[id];
      if (!mod) return;
      (mod.needs || []).forEach(n => {
        if (!on.has(n)) { on.add(n); changed = true; }
      });
    });
  }
  return [...on];
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 4 — RESOLVE UI
   Core ki base list + sirf on modules ka `adds`. Bas. Aur kuch nahi.
   Jo is nateeje mein nahi, woh DOM mein banega hi nahi (E3 ka kaam).
   ───────────────────────────────────────────────────────────────────────── */

function resolveUI(client) {
  const core = corePrintFor(client.coreId);
  const mods = enabledModules(core, client);
  const lang = (client.lang) || core.defaults.lang;

  const tabs     = new Set(core.tabs);
  const cards    = new Set(core.dashboardCards);
  const actions  = new Set(core.quickActions);
  const entities = new Set(core.entities);
  const reports  = new Set(core.reports);
  const fields   = {};

  // COA: base Core ka, phir module apne khaate laata hai.
  // Code par merge — takraav khamoshi se nahi guzarta.
  const accounts = new Map();
  core.coa.forEach(a => accounts.set(a.code, a));

  mods.forEach(id => {
    const m = MODULES[id];
    if (!m) throw new Error('Module mafqood: ' + id);
    const add = m.adds || {};

    (add.tabs    || []).forEach(x => tabs.add(x));
    (add.cards   || []).forEach(x => cards.add(x));
    (add.reports || []).forEach(x => reports.add(x));

    (add.accounts || []).forEach(a => {
      if (typeof a === 'string') return;            // pehle se Core mein hai
      const old = accounts.get(a.code);
      if (old && old.name !== a.name)
        throw new Error('COA takraav: ' + a.code + ' — "' + old.name + '" vs "' + a.name + '"');
      accounts.set(a.code, a);
    });

    Object.entries(add.fields || {}).forEach(([ent, list]) => {
      fields[ent] = [...new Set([...(fields[ent] || []), ...list])];
    });
  });

  // Tabs ki tarteeb Core ke tabOrder se — module on/off karne par
  // tabs idhar udhar na hilein
  const ordered = (core.tabOrder || core.tabs)
    .filter(x => tabs.has(x))
    .concat([...tabs].filter(x => !(core.tabOrder || []).includes(x)));

  return {
    coreId:     core.id,
    coreVersion:core.version,
    lang:       lang,
    dir:        (LANG[lang] || LANG.en)._dir,
    vocab:      core.vocab,
    orderTypes: core.orderTypes,
    rules:      core.rules,
    payment:    core.payment,
    modules:    mods,
    tabs:       ordered,
    cards:      [...cards],
    actions:    [...actions],
    entities:   [...entities],
    reports:    [...reports],
    accounts:   [...accounts.values()],
    fields:     fields,
    expenseHeads: core.expenseHeads,
    numbering:  core.numbering
  };
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 5 — USOOL POOCHNE KE TAREEQE
   Poore software mein yeh sawal sirf inhi se poochhe jayein.
   Kahin bhi `client.type === 'Restaurant'` dobara na likha jaye.
   ───────────────────────────────────────────────────────────────────────── */

function can(ui, ruleName)      { return ui.rules[ruleName] === true; }
function hasTab(ui, tabId)      { return ui.tabs.includes(tabId); }
function hasModule(ui, modId)   { return ui.modules.includes(modId); }
function hasCard(ui, cardId)    { return ui.cards.includes(cardId); }
function hasEntity(ui, entId)   { return ui.entities.includes(entId); }

/* Udhaar ka jawab — ek hi jagah se, ek hi sawal par.
   Naam hai to udhaar ho sakta hai. Naam nahi to nahi.
   Order ki qism (Dine-in / Delivery / Reservation) ka is se koi taalluq nahi. */
function creditAllowed(ui, orderTypeId, customer) {
  if (ui.rules.walkInCredit === false) return !!(customer && customer.name);
  return true;
}

/* Bakaya — hisaab ki wahid jagah. pay_method ka khana kahin nahi. */
function dueOf(order)      { return (order.bill || 0) - (order.received || 0); }
function isSettled(order)  { return dueOf(order) <= 0; }

/* Adhoori adaigi ki ijazat sirf naam wale grahak ko —
   warna bakaya kis ke naam likhein? */
function canPartPay(ui, customer) {
  return ui.payment.partialAllowedWhen === 'customer.named'
    ? !!(customer && customer.name)
    : true;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 6 — KHUD-JAANCH
   App shuru hote hi chalti hai. Core ghalat ho to foran pata chale,
   client ke saamne nahi.
   ───────────────────────────────────────────────────────────────────────── */

function auditCorePrints() {
  const problems = [];

  Object.values(COREPRINTS).forEach(core => {
    const tag = '[' + core.id + '] ';

    // COA mein do ek jaise code
    const codes = core.coa.map(a => a.code);
    codes.filter((c,i) => codes.indexOf(c) !== i)
         .forEach(c => problems.push(tag + 'COA mein code do baar: ' + c));

    // Module jiska wujood hi nahi
    [...core.modules.default, ...core.modules.optional].forEach(m => {
      if (!MODULES[m]) problems.push(tag + 'module mafqood: ' + m);
    });

    // Default module ki zaroorat default mein na ho
    core.modules.default.forEach(m => {
      (MODULES[m]?.needs || []).forEach(n => {
        if (!core.modules.default.includes(n))
          problems.push(tag + m + ' ko ' + n + ' chahiye magar woh default mein nahi');
      });
    });

    // Har tab tabOrder mein maujood ho
    core.tabs.forEach(t => {
      if (core.tabOrder && !core.tabOrder.includes(t))
        problems.push(tag + 'tab "' + t + '" tabOrder mein nahi');
    });

    // Har lebal ki chaabi har zaban mein maujood ho
    Object.keys(LANG).forEach(lg => {
      core.orderTypes.forEach(ot => {
        if (!LANG[lg][ot.labelKey])
          problems.push(tag + 'chaabi "' + ot.labelKey + '" zaban ' + lg + ' mein nahi');
      });
      core.dashboardCards.forEach(c => {
        if (!LANG[lg][c])
          problems.push(tag + 'chaabi "' + c + '" zaban ' + lg + ' mein nahi');
      });
    });
  });

  return problems;
}

/* =========================================================================
   HF SOLUTIONS — E3: DENY-BY-DEFAULT GATE
   =========================================================================
   Purana tareeqa ULTA tha: sab kuch maujood, Core Print kuch chhupata.
   Chhupana bhoolna aasan hai — isi se services client ko restaurant ki
   cheezein dikhi thin. Chhupi hui cheez phir bhi DOM mein hoti hai:
   inspect karo, CSS badlo, ya ek bug — aur woh saamne aa jati hai.

   E3 ka tareeqa: jo Core Print ne elaan nahi kiya, woh BANTA HI NAHI.
   Na chhupta hai, na disabled hota hai — wujood mein hi nahi aata.

   E1 aur E2 is se pehle load hon.
   ========================================================================= */


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 1 — SESSION
   Poore software mein ek hi ui object. Har render isi se poochta hai.
   ───────────────────────────────────────────────────────────────────────── */

let UI = null;

function openClient(client) {
  const problems = auditCorePrints();
  if (problems.length) {
    console.error('CORE PRINT MEIN MASLA:', problems);
    throw new Error('Core Print theek nahi — client nahi khol sakte');
  }
  UI = resolveUI(client);
  document.documentElement.lang = UI.lang;
  document.documentElement.dir  = UI.dir;
  return UI;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 2 — GATE
   Har banane wala raasta yahin se guzarta hai. Koi doosra raasta nahi.
   ───────────────────────────────────────────────────────────────────────── */

/* Tab ka khaka. Core mein na ho to null — DOM mein kuch nahi jata. */
function gateTab(tabId, buildFn) {
  if (!UI) throw new Error('Pehle openClient() chalayein');
  if (!UI.tabs.includes(tabId)) return null;
  return buildFn();
}

function gateCard(cardId, buildFn) {
  return (UI && UI.cards.includes(cardId)) ? buildFn() : null;
}

function gateAction(actionId, buildFn) {
  return (UI && UI.actions.includes(actionId)) ? buildFn() : null;
}

function gateModule(moduleId, buildFn) {
  return (UI && UI.modules.includes(moduleId)) ? buildFn() : null;
}

/* Entity ka gate — data ki satah par. Jo entity Core mein nahi,
   us ka record banaya bhi nahi ja sakta. */
function gateEntity(entityId) {
  if (!UI || !UI.entities.includes(entityId))
    throw new Error('Is Core Print mein "' + entityId + '" ka wujood nahi');
  return true;
}

/* Usool ka gate — action chalne se pehle.
   UI mein button na ho, phir bhi koi function seedha chala de to yahan ruke. */
function gateRule(ruleName, value) {
  if (!UI) throw new Error('Pehle openClient() chalayein');
  if (UI.rules[ruleName] === false && value === true)
    throw new Error('Usool ki khilaaf-warzi: ' + ruleName);
  return true;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 3 — LEBAL
   Matn sirf yahan se. Har button do zabanon mein — baRa lebal aur
   neeche chhota doosri zaban ka.
   ───────────────────────────────────────────────────────────────────────── */

function label(key) {
  return t(key, UI ? UI.lang : 'en');
}

function labelPair(key) {
  const main = label(key);
  const sub  = t2(key, UI ? UI.lang : 'en');
  return sub
    ? '<span class="lbl">' + main + '<small class="lbl2">' + sub + '</small></span>'
    : '<span class="lbl">' + main + '</span>';
}

/* Kaaroobar ki zaban — Core ka vocab.
   Restaurant mein "item", Car Rental mein "vehicle". Code ek hi rehta hai. */
function vocab(slot) {
  return label((UI && UI.vocab[slot]) || slot);
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 4 — NAV AUR DASHBOARD
   Sirf woh tabs aur cards jo resolveUI ne diye. Tarteeb Core ke tabOrder se.
   ───────────────────────────────────────────────────────────────────────── */

function renderNav(container) {
  container.innerHTML = '';
  UI.tabs.forEach(tabId => {
    const b = document.createElement('button');
    b.className = 'nav-tab';
    b.dataset.tab = tabId;
    b.innerHTML = labelPair(tabId);
    b.onclick = () => showTab(tabId);
    container.appendChild(b);
  });
}

function renderDashboard(container) {
  container.innerHTML = '';
  UI.cards.forEach(cardId => {
    const el = gateCard(cardId, () => {
      const d = document.createElement('div');
      d.className = 'dash-card';
      d.dataset.card = cardId;
      d.innerHTML = '<div class="card-ttl">' + label(cardId) + '</div>' +
                    '<div class="card-val" id="card-' + cardId + '">—</div>';
      return d;
    });
    if (el) container.appendChild(el);
  });
}

function renderQuickActions(container) {
  container.innerHTML = '';
  UI.actions.forEach(id => {
    const el = gateAction(id, () => {
      const b = document.createElement('button');

/* ─────────────────────────────────────────────────────────────────────────
   HISSA 5 — ORDER FORM
   Yahan teen usool ek saath nafiz hote hain:
   qism ke teen button, naam par udhaar, aur bill/wasool (pay_method nahi).
   ───────────────────────────────────────────────────────────────────────── */

function renderOrderForm(container, state) {
  gateEntity('orders');
  container.innerHTML = '';

  // Qism ke button — sirf woh jo Core ne diye
  const types = document.createElement('div');
  types.className = 'order-types';
  UI.orderTypes.forEach(ot => {
    const b = document.createElement('button');
    b.className = 'otype' + (state.orderType === ot.id ? ' on' : '');
    b.dataset.otype = ot.id;
    b.innerHTML = labelPair(ot.labelKey);
    b.onclick = () => { state.orderType = ot.id; renderOrderForm(container, state); };
    types.appendChild(b);
  });
  container.appendChild(types);

  // Grahak — Walk-in default, ya naam
  const cust = document.createElement('div');
  cust.className = 'cust-row';
  cust.innerHTML =
    '<button class="walkin' + (!state.customer ? ' on' : '') + '">' +
      label('walkin') + '</button>' +
    '<input class="cust-name" placeholder="' + label('customer') + '" value="' +
      ((state.customer && state.customer.name) || '') + '">';
  container.appendChild(cust);

  // Paisa — bill aur wasool. pay_method ka khana banta hi nahi.
  const bill     = state.bill || 0;
  const canCred  = creditAllowed(UI, state.orderType, state.customer);
  const canPart  = canPartPay(UI, state.customer);

  const pay = document.createElement('div');
  pay.className = 'pay-row';
  pay.innerHTML =
    '<div class="fld"><label>' + label('bill') + '</label>' +
      '<output id="o-bill">' + bill + '</output></div>' +
    '<div class="fld"><label>' + label('received') + '</label>' +
      '<input id="o-received" type="number" min="0" max="' + bill + '" ' +
        'value="' + (state.received != null ? state.received : bill) + '" ' +
        (canPart ? '' : 'readonly data-locked="1"') + '></div>' +
    '<div class="fld"><label>' + label('due') + '</label>' +
      '<output id="o-due">' + (bill - (state.received != null ? state.received : bill)) +
      '</output></div>';
  container.appendChild(pay);

  // Walk-in par wasool poore bill se kam ho hi nahi sakta —
  // bakaya kis ke naam likhein?
  const inp = pay.querySelector('#o-received');
  inp.oninput = () => {
    let v = Number(inp.value) || 0;
    if (v > bill) v = bill;
    if (!canPart && v < bill) v = bill;
    if (v < bill && !canCred) v = bill;
    inp.value = v;
    state.received = v;
    pay.querySelector('#o-due').textContent = bill - v;
  };

  return container;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 6 — LEAK KA SHIKAR
   Development ke waqt chalayein. Batata hai ke kaunsi cheez DOM mein hai
   magar Core Print mein nahi. Khali list ka matlab: koi leak nahi.
   ───────────────────────────────────────────────────────────────────────── */

function findLeaks() {
  if (!UI) return ['UI khula hi nahi'];
  const leaks = [];

  document.querySelectorAll('[data-tab]').forEach(el => {
    if (!UI.tabs.includes(el.dataset.tab))
      leaks.push('tab DOM mein hai magar Core mein nahi: ' + el.dataset.tab);
  });
  document.querySelectorAll('[data-card]').forEach(el => {
    if (!UI.cards.includes(el.dataset.card))
      leaks.push('card: ' + el.dataset.card);
  });
  document.querySelectorAll('[data-action]').forEach(el => {
    if (!UI.actions.includes(el.dataset.action))
      leaks.push('action: ' + el.dataset.action);
  });
  document.querySelectorAll('[data-otype]').forEach(el => {
    if (!UI.orderTypes.some(o => o.id === el.dataset.otype))
      leaks.push('order type: ' + el.dataset.otype);
  });

  // Catering ka maal jo restaurant mein nahi hona chahiye
  ['venue','guests','pkg','packages','etypes','addons','quotation','pay_method']
    .forEach(w => {
      if (document.querySelector('[name="' + w + '"], #' + w + ', [data-field="' + w + '"]'))
        leaks.push('purana khana ab bhi maujood: ' + w);
    });

  return leaks;
}

/* ─────────────────────────────────────────────────────────────────────────
   HISSA 1 — ALAG JAGAH
   Order ka record: paisa, grahak, khaate. Seal.
   Ticket: sirf pakane ke liye. Paisa is mein hai hi nahi.
   ───────────────────────────────────────────────────────────────────────── */

const KQ = {
  tickets: [],      // { id, orderId, token, lines[], status, at }
  nextToken: 1,
  // Token order ke number se alag hai. Roz 1 se shuru.
  // Warna kal ko koi order number aur token ko ek samajh lega.
  tokenDay: null
};

const TICKET_STATUS = ['new', 'cooking', 'ready', 'called', 'cleared'];


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 2 — CONFIRM PAR TICKET
   Yeh WAHID raasta hai jahan order aur kitchen milte hain — aur yahan
   bhi sirf id aur khane ke naam jate hain. Qeemat nahi.
   ───────────────────────────────────────────────────────────────────────── */

function makeTicket(order) {
  if (!hasModule(UI, 'kitchenDisplay')) return null;   // module off = kuch nahi

  const today = localToday();
  if (KQ.tokenDay !== today) { KQ.tokenDay = today; KQ.nextToken = 1; }

  const ticket = {
    id:      'T' + today + '-' + KQ.nextToken,
    orderId: order.id,              // sirf hawala. Order ko chhoota nahi.
    token:   KQ.nextToken++,
    orderType: order.orderType,     // Dine-in / Delivery — pakane wale ko pata ho
    lines: (order.items || []).map(i => ({
      name: i.name,
      qty:  i.qty
      // QEEMAT YAHAN NAHI. Kitchen ko paise se koi kaam nahi.
      // Is ki ghair-maujoodgi hi zamanat hai ke hisaab nahi hil sakta.
    })),
    status: 'new',
    at:     new Date().toISOString()
  };

  KQ.tickets.push(ticket);
  return ticket;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 3 — KITCHEN SCREEN
   Sirf KQ parhti aur likhti hai. Kisi aur cheez ko haath nahi lagati.
   ───────────────────────────────────────────────────────────────────────── */

function kitchenBoard() {
  return KQ.tickets
    .filter(t => t.status !== 'cleared')
    .sort((a, b) => a.token - b.token);
}

function setTicketStatus(ticketId, status) {
  if (!TICKET_STATUS.includes(status))
    throw new Error('Ticket ki haalat ghalat: ' + status);

  const t_ = KQ.tickets.find(x => x.id === ticketId);
  if (!t_) return null;

  t_.status = status;
  t_.at = new Date().toISOString();

  // Yahan order ko chhune ka koi code NAHI hai — aur na kabhi aana chahiye.
  return t_;
}

function markReady(ticketId)  { return setTicketStatus(ticketId, 'ready'); }
function markCalled(ticketId) { return setTicketStatus(ticketId, 'called'); }
function clearTicket(ticketId){ return setTicketStatus(ticketId, 'cleared'); }


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 4 — CUSTOMER SCREEN
   Sirf PARHTI hai. Koi button nahi, koi tabdeeli nahi.
   ───────────────────────────────────────────────────────────────────────── */

function customerBoard() {
  return {
    ready:   KQ.tickets.filter(t => t.status === 'ready').map(t => t.token).sort((a,b)=>a-b),
    cooking: KQ.tickets.filter(t => t.status === 'new' || t.status === 'cooking')
                       .map(t => t.token).sort((a,b)=>a-b)
  };
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 5 — ROZ KA SAFAYA
   Din khatam, queue khali. Order ka record haath bhi nahi lagta.
   ───────────────────────────────────────────────────────────────────────── */

function resetKitchenQueue() {
  KQ.tickets = [];
  KQ.nextToken = 1;
  KQ.tokenDay = null;
  // Sale, ledger, P&L — kisi par asar nahi.
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 6 — SABOOT
   Yeh sirf dawa nahi — jaanch. Development mein chalayein.
   ───────────────────────────────────────────────────────────────────────── */

function proveKitchenIsolation(order) {
  const before = JSON.stringify(order);

  const tk = makeTicket(order);
  if (tk) { markReady(tk.id); markCalled(tk.id); clearTicket(tk.id); }
  resetKitchenQueue();

  const after = JSON.stringify(order);
  return {
    orderBadla: before !== after,
    ticketMeinQeemat: tk ? JSON.stringify(tk).includes('price') : false
  };
}

/* =========================================================================
   HF SOLUTIONS — E3c: ROLES, DEVICES, AUR ORDER NUMBER
   =========================================================================
   BUNYADI FAISLA:
   Core Print ROLES ka elaan karta hai. Client tay karta hai ke un mein

/* ─────────────────────────────────────────────────────────────────────────
   HISSA 1 — ROLES (Core ka hissa)
   RESTAURANT_CORE mein `roles` ke taur par shamil hoga.
   ───────────────────────────────────────────────────────────────────────── */

const RESTAURANT_ROLES = {

    canCreateStaff: true,

    denyRules: ['deleteOrder','receivePayment','viewReports','viewCost']
  }
};

/* Device — aadmi nahi. Ek baar joRa, phir khud khulta hai. */
const RESTAURANT_DEVICES = {

    id:'kitchen', labelKey:'kitchen', needsModule:'kitchenDisplay',
    tabs:['kitchen'], actions:[], cards:[], readOnlyAccounts:true
  },
  customerScreen: {
    id:'customerScreen', labelKey:'customerScreen', needsModule:'customerDisplay',
    tabs:['customerScreen'], actions:[], cards:[], readOnlyAccounts:true
  }
};


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 2 — SESSION KE SAATH RESOLVE
   resolveUI Core ka daira deta hai. Yeh us mein se role ka hissa kaatta hai.
   Kabhi baRhata nahi — sirf kam karta hai.
   ───────────────────────────────────────────────────────────────────────── */

function resolveSession(client, session) {
  const base = resolveUI(client);

  // Device: apna chhota daira, Core ke andar se
  if (session.kind === 'device') {
    const dev = RESTAURANT_DEVICES[session.deviceRole];
    if (!dev) throw new Error('Device role mafqood: ' + session.deviceRole);
    if (dev.needsModule && !base.modules.includes(dev.needsModule))
      throw new Error('Yeh device is client par chaalu nahi: ' + dev.needsModule);
    return Object.assign({}, base, {
      role:     dev.id,
      isDevice: true,
      tabs:     dev.tabs,
      cards:    [],
      actions:  [],
      entities: [],              // device koi record nahi bana sakta
      reports:  [],
      canWriteAccounts: false
    });
  }

  const role = RESTAURANT_ROLES[session.role];
  if (!role) throw new Error('Role mafqood: ' + session.role);

  if (role.all) {
    return Object.assign({}, base, {
      role:'owner', isDevice:false, canWriteAccounts:true,
      canCreateStaff:true, canPairDevice:true
    });
  }

  const keep = (list, allowed) => list.filter(x => allowed.includes(x));
  const rules = Object.assign({}, base.rules);
  (role.denyRules || []).forEach(r => { rules[r] = false; });

  return Object.assign({}, base, {
    role:     role.id,
    isDevice: false,
    tabs:     keep(base.tabs,    role.tabs),
    cards:    keep(base.cards,   role.cards),
    actions:  keep(base.actions, role.actions),
    reports:  role.tabs.includes('reports') ? base.reports : [],
    rules:    rules,
    canWriteAccounts: role.id === 'manager',
    canCreateStaff:   false,
    canPairDevice:    false
  });
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 3 — ORDER KA NUMBER
   ASAL KHATRA: 3 phone, teenon apni ginti. Teenon order 43 banayenge.
   Cheema mein yeh nahi hua kyunki ek hi device tha. Basha mein hoga.

   HAL: har device ko ek harf milta hai (A, B, C). Number us harf ke saath
   banta hai. Do device kabhi ek number nahi bana sakte — internet ho ya
   na ho, offline ho ya online.
   ───────────────────────────────────────────────────────────────────────── */

function deviceLetter(session) {
  // Owner ko hamesha 'O'. Staff ko woh harf jo client ne dete waqt diya.
  if (session.role === 'owner') return 'O';
  const L = session.deviceLetter;
  if (!L || !/^[A-Z]$/.test(L))
    throw new Error('Is device ka harf muqarrar nahi — client settings se dein');
  return L;
}

function nextOrderId(client, session) {
  const L = deviceLetter(session);
  const seqKey = 'seq_' + L;
  client.seq = client.seq || {};
  client.seq[seqKey] = (client.seq[seqKey] || 0) + 1;

  const d = new Date();
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return yy + mm + '-' + L + String(client.seq[seqKey]).padStart(4, '0');
  // Misaal: 2609-A0043, 2609-B0043 — dono alag, takraav namumkin
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 4 — STAFF CLIENT BANATA HAI, ADMIN NAHI (Principle 4)
   ───────────────────────────────────────────────────────────────────────── */

function addStaff(client, session, { name, role, pin, letter }) {
  if (!session.canCreateStaff)
    throw new Error('Sirf owner staff bana sakta hai');
  if (!RESTAURANT_ROLES[role] || role === 'owner')
    throw new Error('Yeh role nahi diya ja sakta: ' + role);

  client.staffUsers = client.staffUsers || [];

  if (role === 'orderTaker') {
    const taken = client.staffUsers.filter(s => s.role === 'orderTaker').length;
    if (taken >= 3) throw new Error('Order taker zyada se zyada 3');
    if (!['A','B','C'].includes(letter || ''))
      throw new Error('Order taker ka harf sirf A, B ya C (O/P/Q/R owner ke liye mehfooz)');
    if (client.staffUsers.some(s => s.letter === letter))
      throw new Error('Yeh harf pehle se kisi ke paas hai: ' + letter);
    if (!/^\d{4}$/.test(pin || '')) throw new Error('PIN 4 hindson ka ho');
  }

  const s = { id:'S'+Date.now(), name, role, pin:pin||null, letter:letter||null, active:true };
  client.staffUsers.push(s);
  return s;
}

/* Device joRna — 6 hindson ka code, ek baar. */
function pairDevice(client, session, deviceRole) {
  if (!session.canPairDevice) throw new Error('Sirf owner device joR sakta hai');
  const dev = RESTAURANT_DEVICES[deviceRole];
  if (!dev) throw new Error('Device role mafqood: ' + deviceRole);

  const ui = resolveUI(client);
  if (dev.needsModule && !ui.modules.includes(dev.needsModule))
    throw new Error('Pehle module chaalu karein: ' + dev.needsModule);

  const code = String(Math.floor(100000 + Math.random() * 900000));
  client.pairedDevices = client.pairedDevices || [];
  client.pairedDevices.push({ code, deviceRole, at:new Date().toISOString(), used:false });
  return code;
}

/* Login screen ke option bhi Core se — module band to button hi na bane. */
function loginOptions(client) {
  const ui = resolveUI(client);
  const out = [{ id:'owner', login:'password' }];
  const staff = client.staffUsers || [];
  if (staff.some(s => s.role === 'manager'   && s.active)) out.push({ id:'manager',    login:'password' });
  if (staff.some(s => s.role === 'orderTaker'&& s.active)) out.push({ id:'orderTaker', login:'pin' });
  Object.values(RESTAURANT_DEVICES).forEach(d => {
    if (!d.needsModule || ui.modules.includes(d.needsModule))
      out.push({ id:d.id, login:'pairCode', isDevice:true });
  });
  return out;
}

/* =========================================================================
   HF SOLUTIONS — E4: CLIENT KI PAIDAISH
   =========================================================================
   Teen mutalbay jo aap ne rakhe the, aur yeh file kaise poore karti hai:

   1. "Core ko chherna bilkul nahi"
      Har cheez Core ki NAQAL se banti hai (deepCopy). Client ka record
      Core ki taraf ishara nahi karta — us mein Core ki copy hoti hai.
      Client mein kuch badlo, Core par asar sifr.

   2. "Koi doubling"
      Har seed ka apna taala (seeded.*). Dobara chalao to kuch nahi hota.
      Saath hi naam/code par dedupe — 76 mein se 74 customers isi liye.

   3. "Purane database se masail sifr"
      Purana record IMPORT nahi hota. Sirf catalog utha kar naye saaf
      dhanche mein rakha jata hai. Koi journal, koi balance, koi order.

   E1, E2, E3c pehle load hon.
   ========================================================================= */


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 1 — KHALI CLIENT, CORE KI NAQAL SE
   ───────────────────────────────────────────────────────────────────────── */

function createClient(coreId, { id, name, lang, icon }) {
  const core = corePrintFor(coreId);

  const client = {
    id:   id,
    name: name,
    coreId: core.id,
    coreVersion: core.version,          // kis waqt ke Core se paida hua
    lang: lang || core.defaults.lang,
    currency: core.defaults.currency,
    icon: icon || core.icon,
    since: new Date().toISOString(),
    status: 'active',

    moduleSettings: {},
    staffUsers: [],
    pairedDevices: [],
    seq: {},

    // Core ki NAQAL — ishara nahi
    coa:          deepCopy(core.coa),
    expenseHeads: deepCopy(core.expenseHeads),

    // Client ka apna maal — khali paida hota hai
    menu: [], rawMaterials: [], customers: [], suppliers: [],
    orders: [], purchases: [], expenses: [], payments: [],
    journal: [],

    seeded: {}                          // doubling ka taala
  };

  applyCorePrint(client);
  return client;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 2 — APPLY CORE PRINT
   Core jo maangta hai woh maujood ho. Jo nahi maangta woh nikal jaye.
   Dobara chalao to kuch na badle.

   (Purane record mein client 6 aur 7 ke paas journal, coa, sales, purchases
    the hi nahi — 27 keys. Woh khamoshi se accounting ke baghair chal rahe
    the. Yeh function wahi surakh band karta hai.)
   ───────────────────────────────────────────────────────────────────────── */

function applyCorePrint(client) {
  const core = corePrintFor(client.coreId);
  const ui   = resolveUI(client);
  const report = { banaya: [], nikala: [], chhoRa: [] };

  // Core jo entity maangta hai, woh maujood ho
  ui.entities.forEach(ent => {
    if (ent === 'coa') return;
    if (!Array.isArray(client[ent])) { client[ent] = []; report.banaya.push(ent); }
  });

  // COA: har khaata jo Core/module maangta hai. Code par merge — doubling nahi.
  const have = new Map((client.coa || []).map(a => [a.code, a]));
  ui.accounts.forEach(a => {
    if (!have.has(a.code)) { have.set(a.code, deepCopy(a)); report.banaya.push('coa:' + a.code); }
  });

  // Jo khaate Core mein nahi aur is client ne KABHI istemal nahi kiye —
  // nikal do. Istemal ho chuke hon to chhoR do (warna ledger toot jayega).
  const allowed = new Set(ui.accounts.map(a => a.code));
  const used    = new Set((client.journal || []).map(j => j.account));
  [...have.keys()].forEach(code => {
    if (!allowed.has(code)) {
      if (used.has(code)) report.chhoRa.push('coa:' + code + ' (istemal ho chuka)');
      else { have.delete(code); report.nikala.push('coa:' + code); }
    }
  });
  client.coa = [...have.values()];

  // Expense heads: Core ke defaults maujood hon. Client ke apne kabhi na mitayein.
  const heads = new Set(client.expenseHeads || []);
  core.expenseHeads.forEach(h => heads.add(h));
  client.expenseHeads = [...heads];

  client.coreVersion = core.version;
  return report;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 3 — CATALOG SEED (ek baar, Admin ka kaam — Principle 6)
   Balance kabhi import nahi hota. Client khud ek ek karke daalega.
   ───────────────────────────────────────────────────────────────────────── */

function seedCatalog(client, catalog, { what } = {}) {
  const jobs = what || ['menu','rawMaterials','customers','suppliers','expenseHeads'];
  const done = {};

  const addUnique = (listName, incoming, keyOf) => {
    client[listName] = client[listName] || [];
    const seen = new Set(client[listName].map(keyOf));
    let added = 0, skipped = 0;
    incoming.forEach(x => {
      const k = keyOf(x);
      if (!k || seen.has(k)) { skipped++; return; }
      seen.add(k); client[listName].push(x); added++;
    });
    return { added, skipped };
  };

  const nameKey = x => (x.name || '').trim().toLowerCase();

  jobs.forEach(job => {
    if (client.seeded[job]) { done[job] = 'pehle ho chuka — chhoR diya'; return; }

    if (job === 'menu') {
      done.menu = addUnique('menu',
        (catalog.menu || []).map(m => ({ name:m.name.trim(), price:Number(m.price)||0 })),
        nameKey);
    }

    if (job === 'rawMaterials') {
      done.rawMaterials = addUnique('rawMaterials',
        (catalog.rawMaterials || []).map(r => ({
          name:r.name.trim(), group:r.group || 'Other', unit:r.unit || 'kg',
          avgCost:Number(r.avgCost)||0,
          stock:0            // STOCK HAMESHA SIFR. Purana stock kabhi nahi aata.
        })), nameKey);
    }

    if (job === 'customers' || job === 'suppliers') {
      done[job] = addUnique(job,
        (catalog[job] || []).map(c => ({
          name:c.name.trim(), phone:(c.phone||'').trim(),
          balance:0          // BALANCE HAMESHA SIFR — Principle 6
        })), nameKey);
    }

    if (job === 'expenseHeads') {
      const before = (client.expenseHeads || []).length;
      const set = new Set(client.expenseHeads || []);
      const src = catalog.expenseHeads || {};
      [...(src.coreDefaults || []), ...(src.clientAdded || [])].forEach(h => set.add(h));
      client.expenseHeads = [...set];
      done.expenseHeads = { added: client.expenseHeads.length - before };
    }

    client.seeded[job] = new Date().toISOString();   // taala
  });

  return done;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 4 — JAANCH
   Client kholne se pehle chalti hai. Masla ho to client ke saamne nahi,
   yahan pata chale.
   ───────────────────────────────────────────────────────────────────────── */

function auditClient(client) {
  const ui = resolveUI(client);
  const p = [];

  ui.entities.forEach(e => {
    if (e !== 'coa' && !Array.isArray(client[e])) p.push('entity mafqood: ' + e);
  });

  ui.accounts.forEach(a => {
    if (!client.coa.some(x => x.code === a.code)) p.push('khaata mafqood: ' + a.code);
  });

  const codes = client.coa.map(a => a.code);
  codes.filter((c,i) => codes.indexOf(c) !== i)
       .forEach(c => p.push('khaata do baar: ' + c));

  ['menu','rawMaterials','customers','suppliers'].forEach(l => {
    const names = (client[l] || []).map(x => (x.name||'').trim().toLowerCase());
    names.filter((n,i) => n && names.indexOf(n) !== i)
         .forEach(n => p.push(l + ' mein do baar: ' + n));
  });

  (client.staffUsers || []).forEach(s => {
    if (s.role === 'orderTaker' && !s.letter) p.push('order taker ka harf nahi: ' + s.name);
  });
  const letters = (client.staffUsers||[]).filter(s=>s.letter).map(s=>s.letter);
  letters.filter((l,i)=>letters.indexOf(l)!==i).forEach(l=>p.push('harf do baar: '+l));

  // Purane record ka koi kachra to nahi
  ['packages','addons','guests','venue','etypes','pkg'].forEach(k => {
    if (client[k] !== undefined) p.push('purana khana ab bhi maujood: ' + k);
  });

  return p;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 5 — CORE MEHFOOZ HAI YA NAHI
   Ek client badal kar dekho ke Core hila to nahi.
   ───────────────────────────────────────────────────────────────────────── */

function proveCoreUntouched(coreId, mutateFn) {
  const before = JSON.stringify(corePrintFor(coreId));
  try { mutateFn(); } catch (e) { /* imtehaan jaari rahe */ }
  const after = JSON.stringify(corePrintFor(coreId));
  return { coreBadla: before !== after };
}

/* =========================================================================
   HF SOLUTIONS — E4b: GST AUR UDHAAR KA LEDGER
   =========================================================================
   MASLA: ek hi restaurant mein kuch logon ke udhaar par GST lagta hai,
   kuch par nahi (dost, purana grahak, chhoot wala). Aur kabhi GST band
   bhi kar diya jata hai.

   AGAR YEH GHALAT KIYA JAYE: bill ke waqt tax ka hisaab na rakha jaye aur
   ledger dikhate waqt "GST chaalu hai? to 16% jorh do" likha ho. Phir jis
   din GST band kiya, us din grahak ka 1,160 ka udhaar 1,000 ka dikhne
   lagega. Purani entry chalti-firti badal jayegi.

   IS FILE KA USOOL: tax order par JAM jata hai (freeze at posting).
   Order mein likha rehta hai ke us waqt kitna tax laga — rate bhi, raqam
   bhi. Ledger hamesha wahi parhta hai jo likha tha. GST band karo, grahak
   ko chhoot do, rate badlo — purani entry ka ek paisa nahi hilta.

   Chhoot GRAHAK ki setting hai (client ka data), Core ka hissa nahi.
   ========================================================================= */


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 1 — IS ORDER PAR TAX LAGEGA YA NAHI
   Faisla sirf order banate waqt hota hai. Uske baad kabhi nahi.
   ───────────────────────────────────────────────────────────────────────── */

function taxForOrder(ui, client, customer, payMode) {
  // Module hi band hai
  if (!ui.modules.includes('gst')) return { rate:0, label:null, reason:'module-off' };

  // Grahak ko chhoot hai — dost, purana grahak, jo bhi wajah
  if (customer && customer.taxExempt) return { rate:0, label:null, reason:'customer-exempt' };

  const rates = (client.taxRates) || {};
  const rate  = Number(rates[payMode || 'cash'] ?? rates.cash ?? 0);
  return { rate: rate, label: client.taxLabel || 'GST', reason:'normal' };
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 2 — ORDER BANANA
   Yahan tax jam jata hai. `tax` ka block order ke andar likha jata hai
   aur phir kabhi dobara nahi ginta.
   ───────────────────────────────────────────────────────────────────────── */

function buildOrder(ui, client, session, { orderType, customer, items, received, payMode }) {
  gateEntity('orders');

  const sub = (items || []).reduce((s,i) => s + (Number(i.price)||0) * (Number(i.qty)||0), 0);
  const tx  = taxForOrder(ui, client, customer, payMode);
  const taxAmount = Math.round(sub * tx.rate) / 100;
  const bill = sub + taxAmount;

  // Udhaar ka usool — E2 se, ek hi jagah
  const got = (received == null) ? bill : Number(received);
  if (got < bill && !creditAllowed(ui, orderType, customer))
    throw new Error('Is grahak ko udhaar nahi diya ja sakta');
  if (got < bill && !canPartPay(ui, customer))
    throw new Error('Adhoori adaigi sirf naam wale grahak ko');
  if (got > bill) throw new Error('Wasool bill se zyada nahi ho sakta');

  return {
    id: nextOrderId(client, session),
    at: new Date().toISOString(),
    orderType,
    customer: customer ? { name: customer.name } : null,
    items: (items||[]).map(i => ({ name:i.name, qty:Number(i.qty)||0, price:Number(i.price)||0 })),

    subtotal: sub,

    // JAM GAYA — yeh block baad mein kabhi nahi badalta
    tax: { rate: tx.rate, amount: taxAmount, label: tx.label, reason: tx.reason },

    bill,
    received: got,
    postedBy: session.role,
    coreVersion: ui.coreVersion
  };
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 3 — LEDGER
   Sirf order mein likhi hui raqmein parhta hai. Kuch dobara nahi ginta.
   ───────────────────────────────────────────────────────────────────────── */

function postOrder(client, order) {
  const J = [];
  const due = order.bill - order.received;

  if (order.received > 0)
    J.push({ account:'1000', dr:order.received, cr:0, ref:order.id, at:order.at });

  if (due > 0) {
    if (!order.customer)
      throw new Error('Bakaya kis ke naam? Walk-in par udhaar nahi.');
    J.push({ account:'1100', dr:due, cr:0, ref:order.id, at:order.at,
             party:order.customer.name });
  }

  J.push({ account:'4000', dr:0, cr:order.subtotal, ref:order.id, at:order.at });

  // Tax ka khaata sirf tab jab us order par waqai tax laga tha
  if (order.tax.amount > 0)
    J.push({ account:'2250', dr:0, cr:order.tax.amount, ref:order.id, at:order.at });

  const dr = J.reduce((s,x)=>s+x.dr,0), cr = J.reduce((s,x)=>s+x.cr,0);
  if (Math.abs(dr-cr) > 0.009)
    throw new Error('Journal barabar nahi: Dr ' + dr + ' Cr ' + cr);

  client.journal = client.journal || [];
  J.forEach(x => client.journal.push(x));
  client.orders = client.orders || [];
  client.orders.push(order);
  return J;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 4 — GRAHAK KA KHATA
   Journal se banta hai, order ko dobara gin kar nahi.
   Isi liye GST band karne se purana udhaar nahi hilta.
   ───────────────────────────────────────────────────────────────────────── */

function customerLedger(client, name) {
  const lines = (client.journal||[]).filter(j => j.account==='1100' && j.party===name);
  const paid  = (client.payments||[]).filter(p => p.party===name);
  const owes  = lines.reduce((s,l)=>s+l.dr,0) - paid.reduce((s,p)=>s+(p.amount||0),0);
  return { name, entries: lines.length, owes: Math.round(owes*100)/100 };
}

/* Grahak ko chhoot dena — sirf aage ke orders par asar. */
function setTaxExempt(client, session, name, exempt) {
  if (!session.canWriteAccounts) throw new Error('Ijazat nahi');
  const c = (client.customers||[]).find(x => x.name === name);
  if (!c) throw new Error('Grahak nahi mila: ' + name);
  c.taxExempt = !!exempt;
  return c;   // purane orders ko haath nahi lagta
}

/* =========================================================================
   HF SOLUTIONS — E5: TEEN DEVICE, EK CLIENT (Principle 5)
   =========================================================================
   ASAL MASLA (asal data se):
   client_data ka blob 484 KB ka hai. Us ka 83% journal hai — 1,556 entries.
   Har chhoti tabdeeli par POORA blob cloud par likha jata hai.

   Ek device ho to chal jata hai. Teen ho to: A ne blob parha, B ne parha,
   A ne likha, B ne likha — A ka kaam mit gaya. Ismein "shayad" nahi hai,
   yeh hoga. Purana bug yehi tha.

   Aur blob mein koi version ka khana nahi — sirf updated_at. Yaani likhne
   wale ko pata hi nahi chalta ke beech mein kisi aur ne likha tha.

   HAL DO HISSON MEIN:

   1. BATWARA — jo cheez sirf BARHTI hai (orders, journal, payments) woh
      blob se bahar, apni apni row. Do device alag alag row likhte hain,
      takraav ka mauqa hi nahi. Order ka id pehle se mehfooz hai (E3c ka
      device harf: 2609-A0043 kabhi 2609-B0043 se nahi takrata).

   2. TAALA — jo cheez BADALTI hai (menu, settings, catalog) woh blob mein
      rahegi, magar rev ke saath. Likhte waqt rev milana zaroori. Na mile
      to parho, milao, phir likho. Andha upsert kabhi nahi.

   FAIDA: order taker blob ko HAATH HI NAHI LAGATA. Woh sirf apni order row
   likhta hai. Teen phone chalein, blob par jhagRa sifr.
   ========================================================================= */


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 1 — KAUN SI CHEEZ KAHAN
   ───────────────────────────────────────────────────────────────────────── */

const APPEND_ONLY = ['orders','journal','payments','purchases','expenses','voids',
  'bookings','taxiTrips','vehicle-purchase','checkouts'];   // Car Rental (E8)
// Yeh kabhi badalte nahi, sirf barhte hain. Apni row, apna id.

const BLOB_FIELDS = ['name','lang','currency','icon','status','coreId','coreVersion',
                     'moduleSettings','taxRates','taxLabel','menu','rawMaterials',
                     'customers','suppliers','coa','expenseHeads','staffUsers',
                     'pairedDevices','seeded','seq',
                     'cashOverride','closedDays','openingPosted','openingCash',
                     'vehicles','loans'];   // Car Rental (E8) — gaRiyan aur loan catalog jaisi cheezein
// Yeh badalte hain. Taale ke peeche.

function blobOf(client) {
  const out = {};
  BLOB_FIELDS.forEach(k => { if (client[k] !== undefined) out[k] = client[k]; });
  return deepCopy(out);   // NAQAL. Hawala dene se client ki tabdeeli chupke
                          // se "cloud" copy mein bhi chali jati thi.
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 2 — KAUN BLOB LIKH SAKTA HAI
   Order taker nahi. Yeh sab se baRi hifazat hai — jhagRa hi na ho.
   ───────────────────────────────────────────────────────────────────────── */

function canWriteBlob(session) {
  return session.role === 'owner' || session.role === 'manager';
}

function assertCanWriteBlob(session) {
  if (!canWriteBlob(session))
    throw new Error('Yeh cheez sirf owner ya manager badal sakta hai');
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 3 — APPEND-ONLY LIKHNA
   Har record apni row. Koi merge nahi, koi takraav nahi.
   ───────────────────────────────────────────────────────────────────────── */

async function pushRecord(db, clientId, kind, record) {
  if (!APPEND_ONLY.includes(kind))
    throw new Error('Yeh append-only nahi: ' + kind);
  if (!record.id)
    throw new Error('Record ka id zaroori hai');

  // id pehle se mehfooz hai (device harf). Dobara bheja jaye to
  // wahi row dobara likhti hai — nateeja wahi. Doubling nahi.
  return db.upsertRow(kind, {
    id: record.id,
    client_id: clientId,
    data: record,
    at: record.at || new Date().toISOString()
  });
}

/* ── DEVICE KI APNI MEHFOOZ JAGAH ──────────────────────────────────────
   Do cheezein device par likhi jani zaroori hain, warna app band hone
   ya cache saaf hone par kaam zaya hota hai:

   1. seq — device ka order counter. Cache saaf hua aur yeh na bacha to
      2609-A0001 DOBARA banta hai aur purane order par likh jata hai.
   2. OUTBOX — offline ke orders. Memory mein rahe aur app band ho jaye
      to order gaayab.

   Dono ab localStorage mein. (Node mein test ke liye fallback.) */

const DEV_STORE = (typeof localStorage !== 'undefined') ? localStorage : (() => {
  const m = {};
  return { getItem:k=>(k in m ? m[k] : null), setItem:(k,v)=>{m[k]=String(v);},
           removeItem:k=>{delete m[k];}, _wipe:()=>{Object.keys(m).forEach(k=>delete m[k]);} };
})();

function seqKeyFor(clientId, letter) { return 'hf_seq_' + clientId + '_' + letter; }

function readSeq(clientId, letter) {
  return Number(DEV_STORE.getItem(seqKeyFor(clientId, letter))) || 0;
}
function writeSeq(clientId, letter, n) {
  DEV_STORE.setItem(seqKeyFor(clientId, letter), String(n));
}

/* Offline queue — device par mehfooz */
const OUTBOX = [];

function loadOutbox() {
  // Phone wali qatar memory wali ke saath MILAO, jorho mat.
  // (Pehle har login par qatar dugni ho jati thi — 6 se 12.)
  try {
    const raw = DEV_STORE.getItem('hf_outbox');
    if (raw) {
      const have = new Set(OUTBOX.map(j => j.kind + ':' + j.record.id));
      JSON.parse(raw).forEach(j => {
        const k = j.kind + ':' + j.record.id;
        if (!have.has(k)) { have.add(k); OUTBOX.push(j); }
      });
    }
  } catch (e) { /* kharab data — chhoR do */ }
  return OUTBOX.length;
}
function saveOutbox() {
  try { DEV_STORE.setItem('hf_outbox', JSON.stringify(OUTBOX)); } catch (e) {}
}

function queueRecord(clientId, kind, record) {
  OUTBOX.push({ clientId, kind, record, tries:0 });
  saveOutbox();               // FORAN likho — app abhi band ho sakti hai
  return record.id;
}

let LAST_SYNC_ERROR = null;

/* Jo client ABHI login hai. Qatar mein sirf isi ki entries upload hongi.
   Yeh pehra flushOutbox ke ANDAR hai — kyunki qatar kai jagah se flush
   hoti hai (login, sync, logout). Pehle pehra sirf ek jagah tha, aur
   login wala raasta us ke bahar se guzar kar Cheema ki atki entries
   Basha ke naam upload kar deta tha. */
let ACTIVE_CLIENT_ID = null;

async function flushOutbox(db) {
  const left = [];
  LAST_SYNC_ERROR = null;
  for (const job of OUTBOX) {
    // Kisi aur client ki entry: na upload, na phenko — sambhal kar rakho
    if (!ACTIVE_CLIENT_ID || job.clientId !== ACTIVE_CLIENT_ID) { left.push(job); continue; }
    try { await pushRecord(db, job.clientId, job.kind, job.record); }
    catch (e) {
      // Ghalti CHUPAO MAT. Pehle har ghalti nigal li jati thi — entry
      // chupke se qatar mein padi rehti aur kisi ko pata na chalta.
      LAST_SYNC_ERROR = e.message || String(e);
      job.tries++;
      left.push(job);   // kabhi mat phenko — 20 koshishon ke baad bhi nahi
    }
  }
  OUTBOX.length = 0;
  left.forEach(j => OUTBOX.push(j));
  saveOutbox();
  return { baqi: OUTBOX.length };
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 4 — BLOB PAR TAALA
   Parho (rev ke saath) → badlo → likho (rev milao).
   Beech mein kisi aur ne likha ho to dobara parho aur milao.
   ───────────────────────────────────────────────────────────────────────── */

async function updateBlob(db, client, session, changeFn, { tries = 4 } = {}) {
  assertCanWriteBlob(session);

  for (let i = 0; i < tries; i++) {
    const cur = await db.readBlob(client.id);          // { data, rev }
    const next = deepCopy(cur.data);

    changeFn(next);                                     // tabdeeli yahan

    const res = await db.writeBlobIfRev(client.id, next, cur.rev);
    if (res.ok) {
      Object.assign(client, next);
      return { ok:true, rev:res.rev, koshishein:i+1 };
    }
    // Kisi aur ne beech mein likha — dobara parho aur wahi tabdeeli
    // naye data par lagao. Andha overwrite kabhi nahi.
  }
  throw new Error('Blob par taala nahi mila — baad mein koshish karein');
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 5 — MILANA (jab do device ne sach mein alag cheezein badli hon)
   Sirf list wali cheezon ke liye. Naam/code par union — kuch mitta nahi.
   ───────────────────────────────────────────────────────────────────────── */

function mergeLists(mine, theirs, keyOf) {
  const out = [], seen = new Set();
  [...theirs, ...mine].forEach(x => {          // dono taraf ka sab kuch
    const k = keyOf(x);
    if (!k || seen.has(k)) return;
    seen.add(k); out.push(x);
  });
  return out;
}

function mergeBlob(mine, theirs) {
  // Bug jo yahan pakRa gaya: 'vehicles' is list mein shamil nahi thi,
  // isi liye har sync par gaRiyan cloud ki PURANI (khaali) copy se
  // overwrite ho rahi thin — do device ki zaroorat bhi nahi, akele
  // device mein bhi hota tha (pehli login ke waqt ka khaali blob hi
  // "theirs" ban jata tha, aur baad mein jori gayi gaRiyan girti rahin).
  const key = x => (x.name || x.code || x.id || x.reg || '').toString().trim().toLowerCase();
  const out = deepCopy(theirs);                 // cloud wala bunyad

  ['menu','rawMaterials','customers','suppliers','coa','staffUsers','vehicles','loans']
    .forEach(l => {
      if (Array.isArray(mine[l]) && Array.isArray(theirs[l]))
        out[l] = mergeLists(mine[l], theirs[l], key);
    });

  out.expenseHeads = [...new Set([...(theirs.expenseHeads||[]), ...(mine.expenseHeads||[])])];

  // seq: har device ka apna counter — hamesha baRa wala jeete,
  // warna do device ek number dobara bana sakte hain
  out.seq = Object.assign({}, theirs.seq || {});
  Object.entries(mine.seq || {}).forEach(([k,v]) => {
    out.seq[k] = Math.max(Number(v)||0, Number(out.seq[k])||0);
  });

  return out;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 6 — ORDER BHEJNA (poora raasta)
   Order taker isi se guzarta hai. Blob ko chhoota hi nahi.
   ───────────────────────────────────────────────────────────────────────── */

async function submitOrder(db, client, session, order) {
  const J = postOrder(client, order);           // hisaab local mein banta hai

  queueRecord(client.id, 'orders', order);
  J.forEach((j, n) => queueRecord(client.id, 'journal',
    Object.assign({ id: order.id + '-J' + n }, j)));

  // seq blob mein hai — magar order taker blob nahi likh sakta.
  // Us ka counter us ke device par rehta hai aur agle blob write par
  // (owner/manager ke haath) mergeBlob ke zariye chadh jata hai.

  try { await flushOutbox(db); } catch (e) { /* offline — OUTBOX mein para rahega */ }
  return { orderId: order.id, journalLines: J.length, baqi: OUTBOX.length };
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 7 — ORDER NUMBER DEVICE PAR MEHFOOZ
   E3c ka nextOrderId client.seq (blob) par chalta tha. Magar order taker
   blob likhta hi nahi — to us ka counter kahin bachta nahi tha.
   Cache saaf hote hi 2609-A0001 DOBARA ban jata aur purane order par
   likh jata. Ab counter device ki apni jagah par hai.
   ───────────────────────────────────────────────────────────────────────── */

function nextOrderId(client, session) {
  const L = (session.role === 'owner')
    ? (session.ownerLetter || (() => { throw new Error('Owner device ka harf nahi mila — startSession() chalayein'); })())
    : deviceLetter(session);
  if (session.seqReady !== true)
    throw new Error('Pehle startSession() chalayein — counter bahal nahi hua');

  const fromDevice = readSeq(client.id, L);
  const fromBlob   = Number((client.seq || {})['seq_' + L]) || 0;
  const n = Math.max(fromDevice, fromBlob) + 1;   // jo baRa ho, us se aage

  writeSeq(client.id, L, n);                      // device par foran
  client.seq = client.seq || {};
  client.seq['seq_' + L] = n;                     // blob ke liye bhi rakho

  const d = new Date();
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return yy + mm + '-' + L + String(n).padStart(4, '0');
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 8 — COUNTER KI BAHALI
   Soorat-e-haal: naya phone, ya poora device wipe. localStorage khali,
   aur blob mein bhi counter nahi (order taker blob likhta hi nahi).
   Purana tareeqa 2609-A0001 dobara banata — purane order par likh jata.

   Hal: cloud se poochho. Orders hi asal record hain.
   Yeh login ke foran baad ek dafa chalti hai.
   ───────────────────────────────────────────────────────────────────────── */

async function recoverSeq(db, client, letter) {
  const prefix = '-' + letter;
  let max = 0;

  const rows = await db.listOrderIds(client.id);      // sirf id ki list
  rows.forEach(id => {
    const i = id.indexOf(prefix);
    if (i < 0) return;
    const n = Number(id.slice(i + 2));
    if (n > max) max = n;
  });

  const known = Math.max(readSeq(client.id, letter),
                         Number((client.seq || {})['seq_' + letter]) || 0);
  const best  = Math.max(max, known);

  writeSeq(client.id, letter, best);
  // Sifr ho to record mein mat likho — "maujood nahi" aur "0" ek hi baat
  // hai, magar likhne se har login par poora record fazool dobara jata tha.
  if (best > 0) {
    client.seq = client.seq || {};
    client.seq['seq_' + letter] = best;
  }
  return { letter, cloudSe: max, deviceSe: known, ab: best };
}

/* Login ke baad ka pehla kaam. Is ke baghair order lena mana. */
async function startSession(db, client, session) {
  if (session.role === 'owner')
    session.ownerLetter = await claimOwnerLetter(db, client, session);

  const L = (session.role === 'owner') ? session.ownerLetter : deviceLetter(session);
  const rec = await recoverSeq(db, client, L);
  loadOutbox();
  try { await flushOutbox(db); } catch (e) { /* offline */ }
  session.seqReady = true;
  return rec;
}


/* ─────────────────────────────────────────────────────────────────────────
   HISSA 9 — OWNER KE EK SE ZYADA DEVICE
   Masla: owner ka harf role se juRa tha, device se nahi. Owner office ke
   PC par baitha hai aur VIP ke liye apne phone se order leta hai — dono
   ka harf 'O'. Dono 2609-O0001 banate hain, ek doosre par likh jata hai.

   (Test mein yahi hua: do order bheje, cloud mein ek bacha.)

   Hal: owner ke har device ka apna harf — O, P, Q, R. Pehli baar login
   par device khud le leta hai aur blob mein apna naam likhwa deta hai.
   Ek baar milne ke baad usi device ka rehta hai.
   ───────────────────────────────────────────────────────────────────────── */

const OWNER_LETTERS = ['O','P','Q','R'];   // owner ke liye mehfooz
const STAFF_LETTERS = ['A','B','C'];       // order taker ke liye

function deviceIdOf() {
  let id = DEV_STORE.getItem('hf_device_id');
  if (!id) {
    id = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    DEV_STORE.setItem('hf_device_id', id);
  }
  return id;
}

async function claimOwnerLetter(db, client, session) {
  const devId = deviceIdOf();

  // Pehle se is device ko mila hua?
  const mine = DEV_STORE.getItem('hf_owner_letter_' + client.id);
  if (mine) return mine;

  let got = null;
  await updateBlob(db, client, session, blob => {
    blob.ownerDevices = blob.ownerDevices || {};

    // Blob mein pehle se darj hai?
    const already = Object.entries(blob.ownerDevices)
      .find(([, d]) => d.deviceId === devId);
    if (already) { got = already[0]; return; }

    const free = OWNER_LETTERS.find(L => !blob.ownerDevices[L]);
    if (!free)
      throw new Error('Owner ke chaar device pehle se darj hain — ' +
                      'settings se purana device nikalein');

    blob.ownerDevices[free] = { deviceId: devId, at: new Date().toISOString() };
    got = free;
  });

  DEV_STORE.setItem('hf_owner_letter_' + client.id, got);
  return got;
}

/* Owner ka device nikalna — harf wapas khali ho jata hai */
async function removeOwnerDevice(db, client, session, letter) {
  await updateBlob(db, client, session, blob => {
    if (blob.ownerDevices) delete blob.ownerDevices[letter];
  });
}

   HISSA 1 — CORE KE KHAATE
   RESTAURANT_CORE.coa mein yeh do izafa hone chahiyein.
