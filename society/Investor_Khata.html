<style>

  --accent:#7CC7A2; --accent-soft:#1C3127; --due:#E7B45A; --due-soft:#33291A; --late:#F08A80; --late-soft:#3A1F1C; --ok:#7CC7A2; --wa:#6FD39C; color-scheme:dark}}
:root[data-theme="dark"]{

  --band:#0A1C15; --band-ink:#EEF3EF; --band-muted:#8FA79A; --brass:#D2B07A; --brass-soft:#2E2618;
  --accent:#7CC7A2; --accent-soft:#1C3127; --due:#E7B45A; --due-soft:#33291A; --late:#F08A80; --late-soft:#3A1F1C; --ok:#7CC7A2; --wa:#6FD39C; color-scheme:dark}

a.wa{display:inline-flex;align-items:center;gap:6px;color:var(--wa);font-weight:600;font-size:.8rem;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}

<script>
/* ===== Accounting engine (pure, no DOM) ===== */
window.IKE=(function(){
const num=x=>Math.round(Number(x)||0);
function addMonths(s,k){const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
const ym=s=>(s||'').slice(0,7);
function statusOf(due,amt,p,today){if(p)return num(p.amount)<amt?'short':'paid';if(!due)return 'up';if(due<today)return 'late';if(ym(due)===ym(today))return 'due';return 'up'}
function schedule(inv,today){
  const amount=num(inv.amount),pct=Number(inv.pct)||0,months=Math.max(1,Number(inv.months)||12);
  const total=Math.round(amount*(1+pct/100));const n=inv.plan==='end'?1:months;const per=Math.floor(total/n);const rows=[];
  for(let i=1;i<=n;i++){const due=addMonths(inv.start,inv.plan==='end'?months:i);const amt=i===n?total-per*(n-1):per;const p=inv.paid&&inv.paid[i]||null;rows.push({i,due,amt,p,st:statusOf(due,amt,p,today)})}
  const paidSum=rows.reduce((a,r)=>a+(r.p?num(r.p.amount):0),0);
  return {total,profit:total-amount,rows,paidSum,left:total-paidSum};
}
function rowsOf(list,today){return (list||[]).map((r,i)=>({i,label:r.label,due:r.due,amt:num(r.amount),p:r.paid||null,st:statusOf(r.due,num(r.amount),r.paid,today)}))}
function summ(rows,total){const paidSum=rows.reduce((a,r)=>a+(r.p?num(r.p.amount):0),0);return {rows,paidSum,total,left:total-paidSum,schedSum:rows.reduce((a,r)=>a+r.amt,0)}}
const purSched=(pu,today)=>summ(rowsOf(pu.schedule,today),num(pu.total));
const saleSched=(pu,today)=>(pu.dispo==='sold'&&pu.sale)?summ(rowsOf(pu.sale.schedule,today),num(pu.sale.total)):null;
function makeACC(s){return {
  '1000':['Cash in Hand','نقد رقم','A'],
  '1500':['Land We Own (at cost)','ہماری زمین (لاگت پر)','A'],
  '1600':['Head Office Owes Us','ہیڈ آفس سے لینا ہے','A'],
  '1610':['Buyers Owe Us','خریداروں سے لینا ہے','A'],
  '2100':['We Owe Land Sellers','زمین فروشوں کو دینا ہے','L'],
  '2200':['We Owe Agents','ایجنٹوں کو دینا ہے','L'],
  '2400':['Investors’ Money','سرمایہ کاروں کی رقم','L'],
  '2410':['Profit Owed to Investors','سرمایہ کاروں کو منافع دینا ہے','L'],
  '2500':['Head Office Advances','ہیڈ آفس کی پیشگی رقم','L'],
  '3100':['Money Put In — '+s.p1en,'سرمایہ — '+s.p1ur,'E'],
  '3110':['Money Put In — '+s.p2en,'سرمایہ — '+s.p2ur,'E'],
  '3200':['Taken Out — '+s.p1en,'نکاسی — '+s.p1ur,'E'],
  '3210':['Taken Out — '+s.p2en,'نکاسی — '+s.p2ur,'E'],
  '3900':['Old Records (before this app)','پرانا حساب (ایپ سے پہلے)','E'],
  '4100':['Land Sold','زمین کی فروخت','I'],
  '4200':['Land Given to Head Office','ہیڈ آفس کو دی گئی زمین','I'],
  '5100':['Cost of Land Sold or Given','فروخت/حوالہ شدہ زمین کی لاگت','X'],
  '5200':['Commission Paid to Agents','ایجنٹوں کا کمیشن','X'],
  '5300':['Profit to Investors','سرمایہ کاروں کا منافع','X'],
  '5400':['Office Expenses','دفتری اخراجات','X'],
  '5900':['Other Expenses','دیگر اخراجات','X']}}
function partnerOf(who,s){if(who==='A'||who===s.p1en||who==='Malik Ashraf Aheer')return 'A';if(who==='Z'||who===s.p2en||who==='Captain Azad')return 'Z';return 'both'}
function buildJournal(D,s,today){
  const J=[];let seq=0;
  const add=(date,narr,lines,src)=>{lines=lines.filter(l=>(l.dr||0)>0||(l.cr||0)>0);if(!lines.length||!date)return;J.push({date,narr,lines,src,o:seq++})};
  (D.investors||[]).forEach(inv=>{const sc=schedule(inv,today);const P=num(inv.amount),T=sc.total,pt=inv.name||'Investor',src={t:'inv',id:inv.id};
    add(inv.start,(inv.cashIn===true?'Investment received — ':'Old investment (before this app) — ')+pt,[{a:inv.cashIn===true?'1000':'3900',dr:P},{a:'2400',cr:P,p:pt}],src);
    sc.rows.forEach(r=>{const pr=T>0?Math.round(r.amt*(T-P)/T):0;
      const accDate=r.p&&r.p.date&&r.p.date<r.due?r.p.date:r.due;
      if(pr>0&&accDate<=today)add(accDate,'Profit due to investor — '+pt+', inst. '+r.i,[{a:'5300',dr:pr},{a:'2410',cr:pr,p:pt}],src);
      if(r.p){const pa=num(r.p.amount);const pp=r.amt?Math.min(pa,Math.round(pa*pr/r.amt)):0;const crA=(r.p.mode==='Purana record'||r.p.mode==='Opening record')?'3900':'1000';
        add(r.p.date,'Return paid — '+pt+', inst. '+r.i+(r.p.ref?' (ref '+r.p.ref+')':''),[{a:'2410',dr:pp,p:pt},{a:'2400',dr:pa-pp,p:pt},{a:crA,cr:pa}],src)}});
  });
  (D.purchases||[]).forEach(pu=>{const T=num(pu.total),sl=pu.seller||'Seller',rf=pu.ref||'land',src={t:'pur',id:pu.id};
    add(pu.date,'Land purchased — '+rf+' from '+sl,[{a:'1500',dr:T},{a:'2100',cr:T,p:sl}],src);
    (pu.schedule||[]).forEach(r=>{if(r.paid){const pa=num(r.paid.amount);add(r.paid.date,'Paid to land seller — '+sl+', '+(r.label||'')+(r.paid.ref?' (ref '+r.paid.ref+')':''),[{a:'2100',dr:pa,p:sl},{a:'1000',cr:pa}],src)}});
    if(pu.dispo==='ho'&&pu.ho){const v=num(pu.ho.value);
      add(pu.ho.date,'Land handed to Head Office — '+rf,[{a:'1600',dr:v,p:'Head Office'},{a:'4200',cr:v}],src);
      add(pu.ho.date,'Cost of land handed over — '+rf,[{a:'5100',dr:T},{a:'1500',cr:T}],src)}
    if(pu.dispo==='sold'&&pu.sale){const v=num(pu.sale.total),b=pu.sale.buyer||'Buyer';
      add(pu.sale.date,'Land sold — '+rf+' to '+b,[{a:'1610',dr:v,p:b},{a:'4100',cr:v}],src);
      add(pu.sale.date,'Cost of land sold — '+rf,[{a:'5100',dr:T},{a:'1500',cr:T}],src);
      (pu.sale.schedule||[]).forEach(r=>{if(r.paid){const pa=num(r.paid.amount);add(r.paid.date,'Received from buyer — '+b+', '+(r.label||'')+(r.paid.ref?' (ref '+r.paid.ref+')':''),[{a:'1000',dr:pa},{a:'1610',cr:pa,p:b}],src)}})}
  });
  (D.receipts||[]).forEach(r=>{const a=num(r.amount),src={t:'rec',id:r.id};const lp=r.purpose==='land'?(D.purchases||[]).find(p=>p.id===r.purId):null;
    let cr,narr;
    if(r.purpose==='land'){cr={a:'1600',cr:a,p:'Head Office'};narr='Received from Head Office for land '+(lp?(lp.ref||''):'')}
    else if(r.purpose==='capA'){cr={a:'3100',cr:a};narr='Capital introduced — '+s.p1en}
    else if(r.purpose==='capZ'){cr={a:'3110',cr:a};narr='Capital introduced — '+s.p2en}
    else{cr={a:'2500',cr:a,p:'Head Office'};narr='Received from Head Office (advance / funding)'}
    add(r.date,narr+(r.ref?' (ref '+r.ref+')':''),[{a:'1000',dr:a},cr],src)});
  (D.deals||[]).forEach(d=>{const c=num(d.commission),ag=d.agent||'Agent',src={t:'deal',id:d.id};
    add(d.date,'Commission due — '+ag+(d.ref?', '+d.ref:''),[{a:'5200',dr:c},{a:'2200',cr:c,p:ag}],src);
    (d.payments||[]).forEach(x=>{const pa=num(x.amount);add(x.date,'Commission paid — '+ag+(x.ref?' (ref '+x.ref+')':''),[{a:'2200',dr:pa,p:ag},{a:'1000',cr:pa}],src)})});
  (D.outs||[]).forEach(o=>{const a=num(o.amount),src={t:'out',id:o.id};let dr,narr;
    if(o.kind==='owner'){const w=partnerOf(o.who,s);
      if(w==='A'){dr=[{a:'3200',dr:a}];narr='Taken out — '+s.p1en}
      else if(w==='Z'){dr=[{a:'3210',dr:a}];narr='Taken out — '+s.p2en}
      else{const tot=(Number(s.p1)||0)+(Number(s.p2)||0)||100;const h=Math.round(a*(Number(s.p1)||50)/tot);dr=[{a:'3200',dr:h},{a:'3210',dr:a-h}];narr='Taken out — both partners'}}
    else{dr=[{a:o.kind==='office'?'5400':'5900',dr:a}];narr=o.kind==='office'?'Office expense':'Other expense'}
    add(o.date,narr+(o.note?' — '+o.note:''),[...dr,{a:'1000',cr:a}],src)});
  J.sort((x,y)=>x.date.localeCompare(y.date)||x.o-y.o);J.forEach((e,i)=>e.no='JV-'+String(i+1).padStart(4,'0'));
  return J;
}
function balances(J,to,from){const m={};J.forEach(e=>{if(to&&e.date>to)return;if(from&&e.date<from)return;e.lines.forEach(l=>{const x=m[l.a]||(m[l.a]={dr:0,cr:0});x.dr+=l.dr||0;x.cr+=l.cr||0})});return m}
return {num,addMonths,ym,statusOf,schedule,rowsOf,purSched,saleSched,makeACC,partnerOf,buildJournal,balances};
})();

function memDb(seed){
  const store={};Object.keys(seed).forEach(c=>{store[c]={};seed[c].forEach(x=>{const r=clean(x);const id=r.id;delete r.id;store[c][id]=r})});
  let subs=[],n=0;const fire=()=>setTimeout(()=>subs.slice().forEach(s=>s.f()),0);
  const add=f=>{const s={f};subs.push(s);setTimeout(f,0);return()=>{subs=subs.filter(x=>x!==s)}};
  const docRef=(c,id)=>({id,set:async b=>{(store[c]=store[c]||{})[id]=clean(b);fire()},update:async b=>{store[c][id]=Object.assign(store[c][id]||{},clean(b));fire()},delete:async()=>{if(store[c])delete store[c][id];fire()},
    onSnapshot:f=>add(()=>f({id,exists:!!(store[c]&&store[c][id]),data:()=>store[c]&&store[c][id]&&clean(store[c][id])}))});
  return {collection:c=>({doc:id=>docRef(c,id||('ex'+(++n)+Date.now().toString(36))),onSnapshot:f=>add(()=>f({docs:Object.entries(store[c]||{}).map(([id,d])=>({id,exists:true,data:()=>clean(d)}))}))}),
    doc:p=>{const [c,id]=p.split('/');return docRef(c,id)}};
}

  const fail=()=>toast(T('Records did not load — reopen the page','ریکارڈ لوڈ نہیں ہوا'));
  const sub=(col,key,arr)=>UNSUB.push(db.collection(col).onSnapshot(s=>{S[arr]=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded[key]=1;render()},fail));
  sub('investors','inv','investors');sub('receipts','rec','receipts');sub('outflows','out','outs');sub('deals','deal','deals');sub('purchases','pur','purchases');

async function safe(fn,ok){
  try{await fn();if(ok)toast(ok)}
  catch(e){const c=e&&e.code;
    if(c==='invalid_argument'){S.canWrite=false;toast(T('You can view this ledger but not edit it','آپ صرف دیکھ سکتے ہیں'));render()}
    else if(c==='quota_exceeded')toast(T('Storage is full — remove old entries','جگہ بھر گئی ہے'));
    else toast(T('Not saved — please try again','محفوظ نہیں ہوا، دوبارہ کوشش کریں'))}
}
async function saveCSV(name,rows){const dl=await window.claude?.use?.('downloads');if(!dl){toast(T('Download is not available here','یہاں ڈاؤن لوڈ دستیاب نہیں'));return}
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  try{await dl.save({filename:name+'-'+todayStr()+'.csv',data:'﻿'+rows.map(r=>r.map(q).join(',')).join('\n')})}catch(e){if(e&&e.code!=='declined')toast(T('File not saved','فائل محفوظ نہیں ہوئی'))}}

async function exportAll(){const L=[];const today=todayStr();
  L.push(['INVESTORS']);L.push(['Investor','WhatsApp','File no','Investment','Start','Inst','Due','Amount','Status','Paid date','Paid','Mode','Ref']);
  S.investors.forEach(inv=>schedule(inv,today).rows.forEach(r=>L.push([inv.name,inv.phone,inv.ref,inv.amount,inv.start,r.i,r.due,r.amt,r.st,r.p?.date,r.p?.amount,r.p?.mode,r.p?.ref])));
  L.push([]);L.push(['LAND']);L.push(['Plot','Seller','WhatsApp','Location','Cost','Item','Due','Amount','Status','Paid date','Paid','Disposal','Buyer / HO','Agreed / sale']);
  S.purchases.forEach(pu=>{const disp=pu.dispo==='ho'?'Head Office':pu.dispo==='sold'?'Sold':'In hand';const who=pu.dispo==='ho'?'Head Office':pu.sale?.buyer||'';const val=pu.dispo==='ho'?pu.ho?.value:pu.sale?.total||'';
    purSched(pu,today).rows.forEach(r=>L.push([pu.ref,pu.seller,pu.phone,pu.location,pu.total,r.label,r.due,r.amt,r.st,r.p?.date,r.p?.amount,disp,who,val]))});
  L.push([]);L.push(['COMMISSION']);L.push(['Date','Agent','WhatsApp','Plot','Deal value','Commission','Paid','Remaining']);
  S.deals.forEach(d=>{const p=dealPaid(d);L.push([d.date,d.agent,d.phone,d.ref,d.value,d.commission,p,num(d.commission)-p])});
  L.push([]);L.push(['JOURNAL']);L.push(['Date','JV','Account','Name','Party','Debit','Credit','Narration']);
  S.J.forEach(e=>e.lines.forEach(l=>L.push([e.date,e.no,l.a,S.ACC[l.a][0],l.p||'',l.dr||'',l.cr||'',e.narr])));
  await saveCSV('investor-khata-all',L);
}
